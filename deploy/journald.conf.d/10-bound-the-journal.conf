# Bound the systemd journal on the appliance that drives the art wall.
#
# Install to /etc/systemd/journald.conf.d/ and `systemctl restart systemd-journald`.
#
# WHY AN EXPLICIT BOUND
#
# Both processes log continuously to the journal, on a machine whose top
# operational risk is its boot medium filling or wearing out. The journal is one
# of only two unbounded-by-default write paths in the whole product (the other is
# the display heartbeat, which carries its own interval). Leaving this to the
# default means the ceiling is inherited rather than chosen, and nobody reviewing
# the deployment can see what it is without knowing systemd's defaulting rules.
#
# The default is NOT unbounded: systemd uses 10% of the filesystem capped at 4G,
# so on this 117 GB card it resolves to 4G rather than growing with the disk. The
# bound below is therefore about stating the ceiling and keeping it proportionate
# to what anyone actually reads, not about averting runaway growth.
#
# WHY 256M
#
# Measured 2026-08-04 on a freshly provisioned card: 9.2 MB of journal after
# first boot and a full provisioning run. 256M is ample history for diagnosing a
# wall that has misbehaved — weeks of it at this rate — while being small enough
# that the journal can never be the reason the catalogue has nowhere to write.
# Raise it if a real incident is ever truncated; that has not happened yet, and
# guessing larger now would just be inheriting a different unexamined number.
#
# SystemMaxFileSize keeps individual segments small enough to rotate and ship
# without handling a quarter-gigabyte file.

[Journal]
SystemMaxUse=256M
SystemMaxFileSize=32M
