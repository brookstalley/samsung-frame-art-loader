# Bound the systemd journal on the appliance that drives the art wall.
#
# Install to /etc/systemd/journald.conf.d/ and `systemctl restart systemd-journald`.
#
# READ THIS FIRST: Raspberry Pi OS ships a VOLATILE journal.
#
# `/usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf` sets
# `Storage=volatile`, so the journal lives in /run/log/journal — a tmpfs, in RAM —
# and NOT in /var/log/journal. That vendor drop-in sorts after this one (40 > 10),
# so it wins, and it is why this file sets two ceilings rather than one:
#
#   SystemMaxUse=   governs the PERSISTENT journal   (/var/log/journal)
#   RuntimeMaxUse=  governs the VOLATILE journal     (/run/log/journal)
#
# Setting only the first is a directive that binds nothing on a stock Pi, while
# reading in configuration exactly as though it does. Both are set so this file is
# correct whichever storage mode is in force, now or after someone changes it.
#
# Two consequences of volatile storage that outlive this file, verified on the
# target 2026-08-04:
#
#   * THE JOURNAL DOES NOT SURVIVE A REBOOT. Diagnosing "the wall froze and the Pi
#     restarted" from `journalctl` finds nothing about the run that failed. If that
#     matters more than the cost below, the fix is Storage=persistent, not a
#     larger bound.
#   * LOGGING DOES NOT WEAR THE CARD. Writes go to RAM. Any reasoning that treats
#     the journal as one of the flash-wear paths is describing a persistent
#     journal, which this is not.
#
# WHY AN EXPLICIT BOUND AT ALL
#
# Both processes log continuously, on a machine whose top operational risk is its
# boot medium. Neither default is unbounded — systemd uses 10% of the backing
# store, capped at 4G for persistent, which resolved to 156.1M of RAM here — so
# the value of setting these is that the ceiling is CHOSEN AND VISIBLE rather than
# inherited from defaulting rules a reviewer would have to know.
#
# WHY 256M
#
# Measured on a freshly provisioned card 2026-08-04: 9.2 MB of journal after first
# boot and a full provisioning run. 256M is weeks of history at that rate. Note it
# is deliberately ABOVE the 156.1M runtime default this machine was using, so on
# volatile storage this raises the ceiling rather than lowering it — that is the
# intent (RAM is 8 GB and 256M of it is affordable), but it is the opposite of
# what "bound the journal" suggests, so it is stated rather than left to be
# discovered.
#
# SystemMaxFileSize/RuntimeMaxFileSize keep individual segments small enough to
# rotate and ship without handling a quarter-gigabyte file.

[Journal]
SystemMaxUse=256M
SystemMaxFileSize=32M
RuntimeMaxUse=256M
RuntimeMaxFileSize=32M
