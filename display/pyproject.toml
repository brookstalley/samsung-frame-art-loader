[project]
name = "display"
version = "0.1.0"
description = "Display plane — reads the theme manifest, drives the television, owns this device's own state."
# **The plane whose version is pinned by hardware, and the reason the two planes
# are sibling uv projects rather than one workspace.** Raspberry Pi OS Trixie
# ships 3.13, and the IT8951 e-paper driver compiles Cython from 2023 sources
# targeting 3.13/3.12 — verified building and importing on 3.13/aarch64 under
# uv's PEP 517 isolation, 2026-08-04. The curation plane declares `>=3.14`, and a
# workspace mixing that with this floor refuses to lock at all.
#
# 3.12 is a floor, not a fallback anyone expects to need. It is declared because
# nothing here requires 3.13, and a floor that matches what the code actually
# uses is the one that stays true.
requires-python = ">=3.12"
dependencies = [
    # **NOT the PyPI package of the same name, and not interchangeable with it.**
    # PyPI `samsungtvws` ships a synchronous art client only — no `async_art`
    # module and no event callbacks — and this plane is built on both. The fork
    # declares the same version string (3.0.5) as the release, so `pip list`
    # cannot tell them apart and a well-meant "upgrade" fails at import rather
    # than loudly. Pinned to the commit verified against the live television.
    "samsungtvws @ git+https://github.com/NickWaterton/samsung-tv-ws-api.git@fe95ef1d784cd32f49bf9a07ec479576574eea07",
    # Floor of 13.0 is set by what the fork above *imports*, not by what it
    # declares. It declares `>=10.2` and imports `websockets.asyncio.client` and
    # `websockets.protocol.State`, neither of which exists before 13.0 — so a
    # resolve honouring the declared floor installs cleanly and fails at import.
    # A declared floor is a claim; what a package imports is the constraint.
    "websockets>=13",
    # The wall's daily rhythm: television brightness follows the sun's position
    # rather than the clock, so a winter afternoon and a summer evening are not
    # given the same panel.
    "astral",
    # **`tzlocal` was here and is not any more (2026-08-06).** It was declared as
    # "the local zone the sun position is computed in", and when the sun-position
    # port actually landed nothing imported it: the daemon's clock reads
    # `datetime.now(UTC).astimezone()`, which takes the zone from the platform, and
    # the 2024 module's `tzlocal.get_localzone()` was a dependency for a thing the
    # standard library already does. The comment below predicted exactly this
    # outcome for a declared-early entry and named the moment it would be due for
    # checking; this is that check, made rather than assumed.
    "python-dotenv",
    # **The panel driver's interchange format, and the only reason this is here.**
    # `panel/epaper.py` hands omni-epd a PIL image because that is what its
    # `display()` takes; nothing else in this plane opens, decodes or composes an
    # image, and the television is still handed a *path* it streams itself.
    #
    # It is a core dependency rather than a panel-only one on purpose, and the
    # purpose is testability: with Pillow always present, the whole of
    # `panel/epaper.py` except its one `open_panel` import runs on a laptop, so
    # the greyscale-mode read-back, the rotation and the conversion of a silent
    # driver failure into a raised one are exercised by the default suite instead
    # of only on a Pi with a panel screwed to it.
    "pillow",
]

# Deliberately absent, and each for a reason worth stating rather than
# rediscovering:
#
#     **That rule was suspended for `astral` and `tzlocal` when this manifest
#     shipped ahead of the plane's first module, and the bill came due on
#     2026-08-06.** The reasoning was that both served the sun-position
#     brightness port, which the build plan recorded as an assumption the
#     operator might defer — so if it were deferred they would be locked entries
#     nothing imports, with nothing to prompt anyone to notice. The port was not
#     deferred; it landed with the daemon, and it took up `astral` and left
#     `tzlocal` unimported, which is precisely the predicted outcome arriving by
#     an unpredicted route. `tzlocal` is gone.
#
#     The lesson worth keeping is not "never declare early" — it is that a
#     declaration made early carries an obligation to *check* it at the moment
#     the importing code lands, and that check has to be somebody's, because
#     nothing mechanical looks for a dependency that is merely unused.
#
#   Nothing else. `pillow` was on this list until the label reached the panel,
#     on the grounds that nothing here decoded an image — true then, and the note
#     above records what changed and why it is now a core dependency rather than
#     a panel-only one.
#
#   Any HTTP client. This is not an omission — it is the norm: the theme manifest
#     file is the only channel from curation to display. The television websocket
#     is the exemption, because talking to the television is this plane's whole
#     job.
#
#     **Enforced mechanically since 2026-08-06** by
#     `tests/preferences/test_plane_isolation.py`, which landed in the same commit
#     as this plane's first modules — the sequencing this comment previously
#     described as owed, and owed for a reason: a check written over an empty
#     package passes vacuously, and a green suite is exactly what a violation
#     looks like without it. It reads the source rather than the running system,
#     follows imports transitively through this repository's own files, and
#     exempts the television websocket. `project-preferences.md` § Enforcement
#     carries the row, which moved back from Critic to Test when the file
#     appeared — and keeps its own history as this repo's cautionary example,
#     because that row named this path for three sessions while nothing was
#     there. An earlier draft of THIS file wrote the same claim a second time.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24",
    # **The label engine is defined by invariants over a space too large to
    # enumerate**, which is what this is here for and the only thing it is used
    # for. Nine of a work's fields are independently present or absent, giving 512
    # content shapes before any surface size is crossed with them — and the
    # properties that matter are universal rather than exemplary: no fact that
    # identifies the work is ever dropped, no optional fact is ever set below the
    # legibility floor, and every fact is either placed or reported. Examples
    # cover the shapes somebody thought of; this covers the ones that decide
    # whether an accessibility norm actually holds.
    #
    # **Run derandomized** — see `tests/conftest.py`. A property suite that finds
    # a new failure on an unrelated commit is a suite people learn to re-run
    # until it passes, which is worse than not having it.
    "hypothesis>=6",
]

# **Two groups rather than one, and the seam between them is which machines can
# install them** — which turns out to be the same seam the code is split on.
#
# `raster` is the text stack. It installs on any modern Linux, including a
# GitHub runner, so the typesetting that this product's accessibility rests on is
# tested by CI rather than only by whoever last had a Pi in front of them.
#
# `epaper` is the panel driver, and it installs on a Raspberry Pi and nowhere
# else: `omni_epd` pulls `IT8951[rpi]`, which compiles Cython against the
# Broadcom SPI and GPIO libraries. Folding it in with `raster` would have made
# the whole label untestable anywhere but on the hardware.
#
# Neither is installed by a default `uv sync`, so a laptop checkout gets the
# television, the suite and no build failures. The Pi installs both; a device with
# a monitor and no e-ink would install only `raster`.
raster = [
    # **3.50 is a floor set by what was verified, not by what is required.** The
    # Pi resolves 3.56 from a wheel and imports Pango and PangoCairo cleanly
    # (aarch64/Trixie, 2026-08-07). Older PyGObject builds against
    # girepository-1.0 rather than 2.0, so a resolve that walks backwards past
    # this floor changes which system libraries the machine needs.
    "PyGObject>=3.50",
    "pycairo>=1.26",
]
epaper = [
    # Not on PyPI, and pinned to the commit the wall runs today. See
    # `[tool.uv]` below for the transitive driver it declares without pinning,
    # which is the half of this that a version string cannot express.
    "omni_epd @ git+https://github.com/robweber/omni-epd.git@1a3acf59522c1a01f64585798af8d98226de8822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/display"]

[tool.uv]
# **The pin that a `[dependency-groups]` entry cannot express, and the decision it
# records.** `omni_epd` declares `IT8951[rpi]` as a git dependency with **no
# commit**, so every rebuild resolves roughly 1,500 lines of Cython the wall
# depends on completely to whatever that repository's master is on the day. It has
# not moved since 2023, which is the only reason builds are reproducible today —
# a fact about upstream inactivity, not a property of this project.
#
# **Pinned rather than vendored**, taken 2026-08-07. A vendor buys exactly one
# thing a pin does not — survival if the upstream repository disappears — and
# costs 1,500 lines of Cython nobody here can maintain, plus the loss of any
# upstream fix. The pin is the commit the wall has run since 2024, recorded in
# `deploy/pi-freeze-2024.txt`; vendoring stays available as the escape hatch if
# that repository ever goes away.
#
# An override rather than a dependency entry, because the requirement being
# corrected is not ours: it is inside `omni_epd`'s own metadata, and only an
# override reaches it.
override-dependencies = [
    "IT8951[rpi] @ git+https://github.com/GregDMeyer/IT8951.git@9f136139378f74e17d9972d7165dc6ae53a2568e",
]

# **The other unpinned axis, and pinning the driver alone would have left it
# open.** `IT8951` compiles its Cython extensions from `.pyx` sources at install
# time and its own build-requires names `Cython` with no bound, so a build in PEP
# 517 isolation resolves the compiler to whatever released most recently — which
# is the one dependency in this project most likely to move, being the only
# actively developed thing in the chain. 3.0 is the series the 2023 sources were
# written against and the series that has built them on this hardware.
build-constraint-dependencies = [
    "Cython>=3.0,<4",
]

[tool.hatch.metadata]
# **The line that lets this plane be a package at all.** Its television client is
# a git dependency, and hatchling refuses a direct reference unless told that one
# is intended — which is the whole of what used to make the build fail.
allow-direct-references = true

# **`[tool.uv] package = false` was here until this plane had a module, and both
# of its reasons were artefacts of the empty tree rather than facts about the
# design.** It recorded that hatchling refused the git-sourced `samsungtvws` as a
# direct reference (one line above fixes that, and always would have) and that
# there was no package directory to put in a wheel (there is one now). What it got
# right is that nothing installs this plane from anywhere else: it is started by a
# systemd unit against this directory, and being a package changes only that its
# own venv can import it.
#
# It has to change, because `src/` layout and "never installed" cannot both hold —
# `python -m display` finds nothing on the path, and the alternative is a
# `PYTHONPATH=src` that every invocation, unit file and test run has to remember.

[tool.black]
# The floor rather than the target: formatting that only parses on 3.13 would
# break the 3.12 this plane declares it supports.
target-version = ["py312"]
line-length = 130

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# The same strict set the curation plane carries, and for the same reason: this
# is new code with no legacy carve-out, so every rule applies to all of it.
# `T20` matters more here than anywhere else in the repo — this plane runs
# unattended on a Pi under systemd, where a `print()` has no level and no
# timestamp and a failure is invisible in the journal.
select = ["E", "F", "I", "UP", "B", "T20", "TRY", "ANN"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# **`T201` is banned in `src/` for a reason that does not apply here.** The daemon
# runs unattended under systemd, where a `print()` has no level and no timestamp
# and a failure is invisible in the journal. `tools/` is the opposite case: these
# are run by hand at a terminal by a person waiting for the answer, and routing
# their output through the logging configuration would put a JSON envelope around
# a sentence somebody is reading.
"tools/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
