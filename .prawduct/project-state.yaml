# Project State — Samsung Frame Art Loader
#
# Single source of truth for all project decisions.
# Read at session start to understand where things stand.
#
# Fields start as null and are filled during discovery.
# Partially-populated state is normal throughout discovery.

# =============================================================================
# CLASSIFICATION
# =============================================================================
# Populated during discovery. Confirmed with the user before planning.

classification:
  # Product domain. Values: utility, social, marketplace, productivity, b2b,
  # content, automation, developer-tool, education, health, finance,
  # entertainment, communication. May be multiple for hybrid products.
  domain: [content, automation, utility]

  # Structural characteristics — architectural facts that determine what KINDS
  # of artifacts a product needs. These are a small, stable set (6) that drive
  # artifact generation. null = not applicable.
  structural:
    # User-facing interface. modality: screen|terminal|voice|spatial|minimal; platform: mobile|web|desktop|cross-platform
    has_human_interface:
      modality: screen
      platform: web
      # Confirmed 2026-07-19: a browser curation UI is the direction. Three
      # distinct output surfaces exist and must not be conflated:
      #   1. the curation web UI (the actual human interface)
      #   2. the Frame TV in art mode (ambient output, no controls)
      #   3. the e-paper label panel (ambient output, no controls)
      # The pre-2024 CLI remains as an operator surface, not the product's UI.
    # Runs without user interaction. trigger: scheduled|event-driven|always-on
    runs_unattended:
      trigger: always-on
      # Display plane is a systemd daemon (Restart=always) reacting to TV
      # websocket callbacks and a sun-position brightness loop. Silent failure
      # is the default failure mode here — see observability_approach.
    # Exposes or consumes APIs. consumers: internal|external|both
    # When this exposes an interface, record the versioning + deprecation + error-model
    # decisions in design_decisions (api_versioning_approach, api_error_model_approach);
    # the api-versioning advisory nudges until they are recorded.
    exposes_programmatic_interface:
      consumers: both
      # FLIPPED from `internal` on 2026-07-19 — a recorded classification change,
      # not a detail. The product exposes an MCP tool surface covering all content
      # management operations, and Claude Code (or any MCP client) drives it:
      # "point Claude Code at the server and say 'add all of Salvador Dali's most
      # famous works'". That is an EXTERNAL consumer — one not deployed from this
      # repo.
      #
      # Surfaces exposed:
      #   * MCP tool surface — external consumers (Claude Code, the in-UI agent)
      #   * HTTP API backing the curation UI's direct controls — internal
      #   * curation↔display plane contract — internal
      # Consumes six foreign surfaces; see foreign_apis below.
      #
      # Consequences re-derived on the flip (methodology/discovery.md, "A
      # structural characteristic flipped"):
      #   1. api_versioning_approach's own revisit trigger FIRED — it said "any
      #      consumer not deployed from this repo". Re-opened below.
      #   2. api_error_model_approach can no longer stay deferred: agents bind to
      #      tool error shapes.
      #   3. An api-contract artifact is now owed (strategy-class coverage).
      #   4. MCP became a CORE surface rather than optional, which promoted the
      #      3tears-mcp/NATS question from medium to decisive. Resolved — see
      #      technical_decisions.technology.
      #   5. New security surface: untrusted web content reaches an agent holding
      #      mutating, spend-incurring tools. See risk_profile.
      #
      # NOT flipped: has_multiple_party_types stays false. An agent is a
      # CONSUMER, not a party type — there is still exactly one principal whose
      # intent matters, and no per-party trust boundary or data isolation.
    # Multiple distinct user types. parties: [list of distinct user types]
    has_multiple_party_types: false
      # Confirmed 2026-07-19: single operator. "Per-user preferences" means named
      # profiles / theme sets that one curator switches between — NOT accounts.
      # No authn, no per-party trust boundary, no data isolation in v1.
      # If this flips, re-derive: auth, data isolation, audit (see norms guide).
    # Handles sensitive information. categories: [PII, financial, health, etc.]; regulatory: [list]
    handles_sensitive_data:
      categories: [credentials]
      regulatory: []
      # No PII, no regulatory surface. Holds an OpenRouter/LLM API key (real
      # spend) and the Samsung TV pairing token. `token_file` is currently
      # committed to git — flagged for removal.
    # Multiple processes or services communicating at runtime. topology: monolith-with-workers|client-server|microservices|pipeline
    multi_process_distributed:
      topology: shared-filesystem-pipeline
      # AMENDED 2026-07-20. Previously `client-server`, described as "two planes on
      # two machines, forced by an irreconcilable Python version constraint". Every
      # part of that is now wrong:
      #   * NOT two machines — both planes run on the one Pi 4 (8 GB), sharing
      #     ART_ROOT. Operator's decision 2026-07-20.
      #   * NOT forced — the 2026-07-19 audit found 3tears' >=3.14 requirement
      #     removable in 16 mechanical sites. The split is a CHOICE, retained on
      #     its own merits (see technical_decisions.architecture).
      #   * NOT client-server — there is no request/response between the planes at
      #     all. Curation writes one versioned JSON manifest; display reads it. The
      #     display plane makes no network call to curation, by ratified norm.
      # Still multi-process, and still warrants architecture.md: two processes that
      # fail and restart independently. Multi-process but NOT distributed — which is
      # why the resilience story is unusually short (no partition, no coordination
      # protocol, no entity written by both).
      #   * curation plane — Python 3.14, FastAPI, web UI + MCP + discovery + images
      #   * display plane  — Python 3.13, TV websocket + e-paper + label rendering
      # This flipped from `false` during discovery when the UX direction landed.

  # Domain-specific characteristics — what makes THIS product unique in its domain.
  # Dynamically identified, not from a predefined list.
  # Each: { characteristic: string, implications: [string] }
  domain_characteristics:
    - characteristic: "Curation is intent-driven, not query-driven"
      implications:
        - "A curation request may be 'find recent award-winning art', not 'Monet's flowers'. The system must discover candidate works, not just filter a known set."
        - "Discovery is an open-ended agentic search over the open web plus museum APIs — unbounded in cost and runtime unless deliberately bounded."
        - "Results need provenance: which source, which licence, why this work matched the intent."
    - characteristic: "Source images are gigapixel and licence-encumbered"
      implications:
        - "Acquisition is tiled (dezoomify-rs) and slow; partial-tile failures are normal and already handled."
        - "Museum rate limits are real — the ARTIC path already throttles."
        - "Rights metadata is captured but never enforced or surfaced; personal display keeps this low-stakes, but it should be a recorded decision, not an omission."
    - characteristic: "Presentation quality is the product"
      implications:
        - "The mat-colour engine (LAB-space, vision-model-assisted) is the hardest-won logic in the codebase and must survive any rewrite."
        - "Output geometry is per-device (4K for the TV, 1448x1072 for the e-paper), so derived artifacts are never portable between planes."
    - characteristic: "Failure is silent by construction"
      implications:
        - "The only feedback channel is a picture on a wall. A stalled loader looks identical to a working one showing a static image."
        - "Existing code makes this worse: upload_file swallows every exception and still reports success."

  # Risk and complexity profile.
  risk_profile:
    # Overall risk: low, medium, high.
    # Drives discovery depth (low: 5-8 questions, medium: 8-15, high: 15-25).
    overall: medium
    # Started low (household utility, no PII). Raised to medium on 2026-07-19 when
    # the UX direction landed: unbounded LLM spend, an alpha framework dependency,
    # and a two-plane topology are each a real failure surface.
    # Specific risk factors identified during classification.
    # Each: { factor, level (low/medium/high), rationale }
    factors:
      - factor: "Unbounded LLM spend on agentic art discovery"
        level: high
        rationale: "'Find recent award-winning art' is an open-ended agent loop, not a single call. Mitigated by a hard monthly cap that fails closed (confirmed 2026-07-19)."
      - factor: "Samsung firmware may remove the art-mode API in a future update"
        level: medium
        rationale: >
          RETIRED AS A BLOCKER 2026-07-19 — operator confirmed art mode still works.
          Cause unknown: either the TV never took the firmware that removed Art Mode
          on some units (1710, Sept 2025), or the model was unaffected. Downgraded
          from high to medium because the risk is now prospective rather than
          present, but NOT to low: the capability the whole product rests on is
          controlled by a vendor who has already removed it from some units, and a
          future auto-update could do the same here. Worth knowing whether TV
          auto-update can be disabled.
      - factor: "3tears is alpha with a shifting public API"
        level: medium
        rationale: "0.x line; README states the API can shift between minor versions. A 3tears breaking change becomes art-loader work. Mitigated by pinning."
      - factor: "E-paper driver stack is dormant upstream"
        level: medium
        rationale: "omni-epd last touched 2024-11, IT8951 2023-11 with no releases and an unpinned dependency. Mitigated by the display-plane interface boundary and by pinning 9f13613."
      - factor: "Two-plane topology introduces a contract to maintain"
        level: low
        rationale: >
          DOWNGRADED from medium 2026-07-20, and its rationale corrected twice over.

          It previously read "Forced by the Python 3.14 vs 3.13 constraint, not
          chosen. Adds a real seam and a second always-on machine." Both halves were
          stale: the 2026-07-19 audit established the split is a CHOICE (the 3.14
          requirement is removable in 16 mechanical sites), and the 2026-07-20
          co-location decision means there is no second machine — both planes run on
          the one Pi. This is the third site where the "forced" phrasing outlived its
          amendment; see learnings.md on retiring a claim being a repo-wide grep.

          The seam is now a single versioned JSON file on a shared local filesystem,
          written atomically and read one-way, with no network between the planes and
          no entity written by both. That is close to the cheapest inter-process
          contract available, which is why this drops to low rather than staying
          medium.
      - factor: "No test suite exists"
        level: medium
        rationale: "Zero tests across 2,216 lines. Any rewrite has no behaviour-preservation net. Reduced by the decision to start the catalogue over rather than migrate it."
      - factor: "A bad discovery run surfaces content unfit for a shared domestic space"
        level: medium
        rationale: >
          Added 2026-07-19. Discovery searches the open web, so a mis-aimed intent
          or a poisoned page can surface work that is explicit, disturbing, or
          simply wrong for a living room. The consequence lands on the household
          persona — people with no interface, who never opted in, and who see
          whatever is on the wall.

          Distinct from the prompt-injection factor below: that one is about an
          attacker steering the agent, this one fires just as easily from an
          honest search returning honest results the curator would not have
          chosen. No adversary required.

          CORRECTED 2026-07-19 by Critic review. This previously read "structurally
          mitigated: agent-initiated additions always queue as candidates, so
          nothing reaches the wall unreviewed" — voided the same day when the
          verdict tool moved onto the MCP surface.

          What mitigates it now: every reviewing surface MUST SHOW THE IMAGE, which
          is what the gate was always really for. A curator accepting on a title and
          a rationale alone is this factor's failure mode, not its mitigation. The
          gate must not be relaxed later on convenience grounds — the spend argument
          for it is weak, this one is not, and "the agent already looked at it" is
          not a substitute for a person having looked.
      - factor: "Untrusted web content reaches an agent holding mutating, spend-incurring tools"
        level: medium
        rationale: >
          Added 2026-07-19 with the MCP flip. Discovery reads arbitrary gallery
          sites, prize pages, and artist portfolios — attacker-influencable text —
          and feeds it into an agent whose MCP tools can mutate the catalogue and
          spend real money. That is the classic prompt-injection shape.

          Genuinely bounded here, and worth being honest about why rather than
          inflating it: there is no PII, no multi-tenancy, no payment surface, and
          the LAN-only/overlay-network exposure means the attacker must first get
          content in front of a discovery run. The realistic worst case is a
          poisoned page steering candidate selection or burning budget — annoying
          and visible, not a breach.

          CORRECTED 2026-07-19 by Critic review. This paragraph previously read
          "agents cannot auto-accept (every addition stops at curator review)" as
          one of two structural mitigations. That bound was VOIDED the same day when
          the review gate moved onto the MCP surface — see
          technical_decisions.data_model — and leaving the sentence here while
          correcting it in the api-contract is exactly the drift the correction was
          supposed to prevent.

          What actually bounds this now, in descending order of strength:
            1. The spend cap fails closed. Unchanged, and the strongest.
            2. Tool authority stays narrow — no filesystem, no shell, no arbitrary
               fetch — so the blast radius stays inside the catalogue.
            3. Acceptance is visible (it changes the wall) and fully reversible
               (archive restores).
            4. The curator is present in the session that issued the request.

          Items 3 and 4 are materially weaker than "cannot", and 4 is a property of
          how the operator works rather than something the system enforces.
      - factor: "Contemporary sources are in-copyright and low-resolution"
        level: medium
        rationale: >
          Added 2026-07-19 with the decision to search the contemporary web. Two
          distinct problems wearing one hat. (a) Quality: web-resolution press
          images cannot fill a 4K panel, and the mat engine assumes native
          resolution inside a mat rather than upscaling into one. (b) Rights: the
          corpus becomes deliberately in-copyright. Private household display
          keeps the legal stakes genuinely low, but the product should record a
          decision rather than inherit a gap.
          BOTH DECISIONS LANDED 2026-07-20 (see technical_decisions.data_model):
          the floor is a minimum rendered size in inches and nothing is ever
          upscaled; rights are display-only and gate nothing. The risk factor
          itself stands — web sources really are lower quality — but it is now a
          managed risk rather than an unaddressed gap.
      - factor: "No PII, no regulatory exposure"
        level: low
        rationale: "Single household, no accounts, credentials only, LAN-only surface reached via overlay network. Caps the blast radius of everything above."

  # Prior art surfaced during discovery (via web search or domain knowledge).
  # Informational — informs scope decisions, not a gate.
  # Each: { name, url (optional), relevance, relationship (alternative|complement|reference) }
  prior_art:
    - name: "NickWaterton/gallery"
      url: "https://github.com/NickWaterton/gallery"
      relevance: "Flask web front-end on a Raspberry Pi for Frame TVs: kiosk vs display modes, a dedicated caption display for metadata, multi-TV, LLM-generated descriptions. By the author of the samsungtvws fork this project already depends on. Closest existing thing to the planned architecture — worth reading before designing the curation UI."
      relationship: reference
    - name: "NickWaterton/samsung-tv-ws-api"
      url: "https://github.com/NickWaterton/samsung-tv-ws-api"
      relevance: "The fork this project pins. Verified alive 2026-07-19: 326 commits, explicit support for LS03A/B/C/D (2021-2024 models), async art API recommended over sync. PyPI samsungtvws shipped 2026-05-28. The 2024 architecture choice held up."
      relationship: complement
    - name: "pacepace/3tears"
      url: "https://github.com/pacepace/3tears"
      relevance: "The user's own alpha framework. Agent-native primitives and multi-provider model adapters are a strong fit; the three-tier cache is sized for multi-pod deployments this product will never have. See artifacts/3tears-integration-findings.md."
      relationship: complement
    - name: "pacepace/scriob"
      relevance: "The user's sibling project and the working precedent for this architecture: engine (CLI) + server (API) + frontend, on 3tears. Its GitL3Backend proves a non-SQL DurableStore L3 is viable, which is what makes a zero-infrastructure 3tears configuration possible here."
      relationship: reference

  # Foreign API surfaces this product consumes but does not own. Each becomes a
  # `**Foreign API:** <name>` annotation on the chunk that first wraps it, which
  # triggers the Critic's verify-api check (methodology/planning.md).
  foreign_apis:
    - name: "Samsung TV WebSocket art API (via samsungtvws fork)"
      notes: >
        Persistent connection, callback-driven. Pinned to fork SHA fa37fff (May
        2024), not PyPI. Verified against source 2026-07-19 — key facts that
        constrain the design:
          * ONE user-upload category exists (MY-C0002). Categories are 2=my
            pictures, 4=favourites, 8=store; nothing creates new ones, and
            upload() takes no category argument.
          * set_slideshow_status accepts only duration/type/category_id — NO
            content-id list. Native slideshow is whole-category or nothing.
          * No album, playlist, or non-destructive remove-from-rotation verb
            across the library's 30 request verbs. delete_list is the only
            removal.
          * Old vs new API split is version-numeric (<4000 = old): old uses
            auto_rotation_*, new uses slideshow_*. Neither is deprecated; the
            failure modes are asymmetric (old fails silently on new TVs, throws
            AssertionError on older ones), so probing must be defensive. The
            existing dual-callback registration in tvart.py is correct.
          * The pinned SHA is ~2 years behind master. Its upload() lacks the
            timeout and CHUNK_SIZE parameters and buffers whole files in memory.
            Category and slideshow semantics are unchanged, so design conclusions
            hold — but the upload reliability improvements are absent.
          * async delete_list has NO return statement, so it always yields None
            and cannot confirm deletion. The sync path returns a value the async
            path does not. Another instance of the silent-failure pattern this
            product is already correcting.
    - name: "Art Institute of Chicago API"
      notes: "api.artic.edu. Already throttled in source_utils.py; responses cached to api-cache/."
    - name: "Google Arts & Culture"
      notes: "HTML scraping via BeautifulSoup, not an API. Breaks silently on markup changes — the most fragile metadata source."
    - name: "OpenRouter (LLM)"
      notes: "Chosen 2026-07-19 for multi-provider routing. Replaces the direct openai==1.37.1 gpt-4o call in ai.py."
    - name: "dezoomify-rs"
      notes: "External binary invoked via subprocess with shell=True. Not a network API, but an unowned interface with its own failure modes and output-parsing contract."
    - name: "IT8951 / omni-epd e-paper drivers"
      notes: "Dormant upstream, unpinned. Display plane only."

# =============================================================================
# PRODUCT DEFINITION
# =============================================================================
# Populated during discovery and definition.

product_definition:
  # One-sentence description of what this product is and why it exists.
  vision: >
    A curated art appliance for a Samsung Frame TV: the curator expresses intent
    in natural language ("recent award-winning work", "American modernists"), an
    LLM-assisted discovery layer finds and acquires matching artwork at gallery
    resolution, and the system presents it on the wall with a museum-quality mat
    and a physical label — without the curator managing files, URLs, or geometry.

  # Measurable success criteria. What does "this worked" look like?
  goals:
    - "A curator can go from a natural-language intent to artwork on the wall without touching the filesystem, editing JSON, or SSHing into the Pi."
    - "A discovery run proposes each WORK exactly once, with one selected image and its alternates behind it. Being shown the same painting several times and asked to pick counts as a failed run even if every instance is individually good."
    - "A curator never accepts a work without having seen its image — on any surface, including an agent's."
    - "Themes/groups are switchable from the web UI and materialise on the TV without a redeploy."
    - "LLM spend stays under a declared monthly ceiling, and hitting the ceiling stops discovery rather than degrading it silently."
    - "The display plane keeps showing art when the curation plane is down."
    - "A failure in the unattended loader is visible without inspecting the wall — it reaches a log or surface a human actually reads."
    - "Mat-colour quality is at least as good as the 2024 implementation. This is a subjective bar; the 41 existing artworks and their hand-tuned mats are the regression corpus."

  # Who uses this product and what they need.
  users:
    # Each persona:
    #   name: string
    #   description: string
    #   technical_level: none | basic | intermediate | advanced
    #   primary_needs: [string]
    #   constraints: [string]
    personas:
      - name: "The curator (operator)"
        description: "The single operator. Owns the hardware, the API keys, and every decision. Technically expert — authors the 3tears framework this product may build on — so the UI must not be condescending, but curation is a leisure activity and must not feel like sysadmin work."
        technical_level: advanced
        primary_needs:
          - "Express curatorial intent in natural language and get real candidate works back"
          - "Review, accept, and reject discovered art before it reaches the wall"
          - "Organise accepted work into themes/groups and switch what the TV is showing"
          - "See what LLM discovery cost, before and after running it"
        constraints:
          - "Will not run Kubernetes, NATS, or heavy infrastructure for a household appliance (stated 2026-07-19)"
          - "Curation happens in short sessions, not long ones"
      - name: "The household (viewers)"
        description: "Everyone who sees the TV. Non-interactive — they never log in, configure, or curate. They experience only the artwork and the physical label beside it."
        technical_level: none
        primary_needs:
          - "Art that looks good on the wall at every time of day"
          - "Enough context to know what they are looking at, via the e-paper label"
        constraints:
          - "No interface, no accounts, no controls — this is the accessibility surface that matters most and it is a physical one"

  # Core user flows (UI), operations (API), or pipeline stages (automation).
  # Each: { name, description, steps (optional), priority (must-have/nice-to-have) }
  core_flows:
    # UPDATED 2026-07-19 (second planning pass) to match artifacts/product-brief.md,
    # which declares this block as its depends_on source. Caught by Critic review
    # after the brief was revised and this was not.
    - name: "Express curatorial intent"
      description: "Curator states an intent — artist, style, prize, period — in the web UI or through an agent. The system interprets it into a discovery strategy."
      priority: must-have
    - name: "LLM-assisted discovery, in two phases"
      description: >
        Phase 1 resolves the intent to a set of WORKS (titles and artists, not
        images). Phase 2 searches per work for image INSTANCES and selects one
        canonical instance, recording why. The distinction is the product's central
        requirement: ten copies of one painting presented for approval is a complete
        failure even though nothing errors. Three consequences — the cost estimate
        becomes computable once the work count is known; the work list IS the
        candidate count, trimmable rather than preset; and phase 2 verifies phase 1,
        because a work with no credible instance is probably invented.
        The work list is gated for approval only when the WORK COUNT crosses a
        configured threshold (amended 2026-07-20 from "the phase-2 estimate crosses
        a configured cost threshold" — a run costs $0.16-0.49, so cost was gating
        on the axis that does not matter; scope is what the curator judges).
      priority: must-have
    - name: "Review and accept a work with its selected image"
      description: >
        Curator reviews one card per WORK, showing the selected image, the alternates
        found, and why this one was chosen. Three verdicts, not two: accept; reject
        the work; or reject the IMAGE and re-search, which keeps the work. Suppression
        therefore has two scopes that must never share a key. The human-in-the-loop
        gate — its durable justification is content appropriateness, and what carries
        it is that the reviewing surface SHOWS THE IMAGE, not that any surface is
        withheld.
      priority: must-have
    - name: "Acquire and prepare"
      description: "Fetch at gallery resolution (tiled where needed), extract and normalise metadata, choose a mat colour, render the 4K TV image and the e-paper label. Largely exists today in art.py / image_utils.py."
      priority: must-have
    - name: "Organise into themes"
      description: "Group accepted works into named themes/profiles. Switching the active theme changes what the TV shows."
      priority: must-have
    - name: "Display and sync"
      description: >
        Keep the accepted library uploaded to the TV and ROTATE THROUGH THE ACTIVE
        THEME'S SUBSET FROM THE HOST, driving the label panel from the resulting
        image_selected callbacks. Corrected 2026-07-19: the TV's native slideshow can
        only be scoped to a whole category, so switching themes through it would mean
        deleting and re-uploading every work. Host-driven rotation makes a theme
        switch cost zero TV writes.
      priority: must-have
    - name: "Ambient adaptation"
      description: "Brightness follows sun position; art mode follows time of day. Exists today in local.py; the auto art-mode logic is currently commented out."
      priority: nice-to-have
    - name: "Drive everything from an agent, over MCP"
      description: >
        Every content-management operation is available as an MCP tool, at parity
        with the web UI. Worked example: point Claude Code at the server and say "add
        all of Salvador Dali's most famous works". The same tools back the in-UI
        agent, which is an MCP client rather than an in-process caller so that one
        agent can manage art libraries on several systems. This is what flipped the
        product to having external API consumers.
      priority: must-have

  # Scope decisions.
  scope:
    v1:                   # Must have for initial release
      - "Verify the Frame TV art API still works on current firmware — DONE 2026-07-19, art mode confirmed working"
      - "Two-plane split: curation plane (Python 3.14, uv-managed) and display plane (Python 3.13, system interpreter), BOTH co-located on the Pi since 2026-07-20"
      - "Web UI for curation with two-phase LLM-assisted discovery, work-plus-image review, and themes"
      - "MCP tool surface covering all content management, at parity with the web UI — five action-dispatch tools on the official `mcp` SDK, over a service layer both MCP tools and HTTP handlers bind"
      - "New catalogue built by curation, seeded with the existing 41 artworks as worked examples"
      - "Hard monthly LLM spend cap that fails closed"
      - "OpenRouter multi-provider model access"
      - "E-paper label rendering behind a display interface"
      - "Test suite established — none exists today"
      - "Deployment values out of source (ART_ROOT first); token_file out of git"
    accommodate:          # Design for but don't build yet
      - "Multiple household accounts with per-user curation (explicitly not v1 — single operator with named profiles)"
      - "Multiple TVs / multiple display planes"
      - "Swapping the e-paper panel or driver without touching curation"
    later:                # Not needed for v1 to be useful
      - "Re-enabling automatic art-mode on/off scheduling (currently commented out in tvart.py)"
      - "Weather-aware brightness (the weather_adjustments table in local.py is hardcoded to 'clear')"
      - "3tears agent memory — DROPPED, not merely deferred. Operator confirmed 2026-07-19 that agents may be stateless across sessions. This removes the only 3tears capability that forces Postgres, so the curation plane is infrastructure-free by decision rather than by compromise."
    never:                # Explicitly out of scope. Each: { item, rationale }
      - item: "Kubernetes, NATS, or multi-pod deployment"
        rationale: "Stated directly by the operator 2026-07-19. One household, one TV, one curation process — the coherence problems this infrastructure solves do not exist here."
      - item: "Migrating the existing all.json schema"
        rationale: "Decided 2026-07-19 to start over with curation rather than migrate. The 41 records have known defects (identity keyed on source URL, per-device TV state embedded, semi-structured artist_details) and all works are re-fetchable from their source URLs."
      - item: "Public or third-party API consumers"
        rationale: "The HTTP surface exists only to back this product's own UI and its display plane."

  # Product identity.
  product_identity:
    name: "Samsung Frame Art Loader"
    personality: >
      Museum, not gadget. The curator-facing surface should feel like a private
      collection management tool — calm, typographic, image-forward — and the
      household-facing surface (TV + label) should disappear entirely into the
      artwork. Nothing on the wall should read as software.
    visual_preferences: >
      Deferred to design. The one hard constraint from the existing product: the
      TV output is the artwork plus a mat, with no chrome, no overlay, and no
      branding — the mat-colour engine exists precisely so the bars look
      deliberate rather than like letterboxing.

  platform: >
    Two processes, ONE machine. AMENDED 2026-07-20 — previously "curation
    deployed wherever Docker or a long-running process is available (desktop,
    NAS, or a second Pi)". The operator decided both planes run on the Pi,
    sharing a data directory. See technical_decisions.architecture and
    artifacts/architecture.md.

    Host: Raspberry Pi 4 Model B, 8 GB, Raspberry Pi OS Trixie, booting from SD
    card.
      * Curation: Python 3.14 venv, FastAPI on uvicorn, systemd unit. Serves the
        web UI, its HTTP API, and the MCP streamable-HTTP endpoint from one ASGI
        application.
      * Display: Python 3.13 venv, systemd daemon (Restart=always), driving a
        Samsung Frame TV over LAN websocket and a Waveshare 6" HD e-paper HAT
        (1448x1072) over SPI.
    The two planes share ART_ROOT on local disk and communicate through exactly
    one file: the theme manifest.

  # Non-functional requirements, calibrated to risk.
  nonfunctional:
    performance: >
      No latency budget on curation — discovery is expected to take minutes and
      is explicitly human-triggered. The display plane must react to a TV
      image-change callback fast enough that the e-paper label is not visibly
      stale; the panel's own refresh (seconds) dominates.

      CORRECTED 2026-07-20: this previously claimed "image preparation moves off
      the Pi entirely, which is a substantial improvement over 2024". Both planes
      now run on the Pi, so image preparation did NOT move off it — the claim is
      withdrawn. It was also weaker than it looked: the 2024 code already
      downsizes to 2048x2048 before the LAB/k-means work (image_utils.py:51-57,
      :77), so peak memory is a few hundred MB rather than the gigabytes the
      phrase implied. On an 8 GB Pi 4 this is comfortable. The real remaining
      exposure is a genuine 1-2 gigapixel Google Arts &amp; Culture scan, which is
      20-40x the measured corpus maximum; see artifacts/architecture.md
      "Scaling Model".
      The hard latency numbers in this product are INHERITED from the MCP client,
      not chosen — see artifacts/nonfunctional-requirements.md "Performance".
    scalability: >
      Explicitly not a goal. Design target is one household, one TV, hundreds of
      artworks. Anything that trades simplicity for scale is the wrong trade here.
    uptime: >
      Display plane: continuous, and must survive the curation plane being down —
      that independence is the main structural benefit of the two-plane split.
      Curation plane: on-demand; downtime is invisible to the household.
    cost_constraints: >
      Hard ceiling of USD 20/month on LLM spend, failing closed (confirmed
      2026-07-19). No cloud hosting costs; both planes run on hardware already
      owned. Note the cap's purpose is to bound an unbounded agent LOOP, not to
      economise on token price — at the chosen models $20 buys far more discovery
      than a household needs, so the cap should feel generous in normal use and
      only bite when something has run away.

  regulatory: []          # Each: { regulation, applicability, impact }
  cost_estimates:         # Each: { item, estimated_monthly_cost, notes }
    # Prices verified against OpenRouter model pages on 2026-07-19. LLM pricing
    # moves fast — re-verify before relying on these figures.
    - item: "LLM — agentic art discovery (text reasoning)"
      estimated_monthly_cost: "$2-15 depending on run frequency"
      notes: >
        Operator selected GLM-5.2 ($0.2219/M in, $0.6974/M out) or DeepSeek V4 Pro
        ($0.435/M in, $0.87/M out); both carry 1M-token context. A discovery run
        estimated at ~500K input + ~20K output costs roughly $0.13 (GLM-5.2) or
        $0.24 (V4 Pro), so $20 buys on the order of 85-160 runs a month. Even at
        10x that estimate the ceiling holds. Cost per run matters far more than
        cost per month and should be shown in the UI before the run.
    - item: "LLM — mat colour selection (vision)"
      estimated_monthly_cost: "negligible"
      notes: >
        One vision call per newly accepted artwork against a 1024x1024 thumbnail.
        Bounded by acceptance rate, not by time. REQUIRES A DIFFERENT MODEL from
        discovery — both models chosen for discovery are text-only (see
        open_questions). Watch the retry loop: ai.py retries up to 5 times on
        malformed JSON, so a persistently bad response costs 5x.
    - item: "Web search during discovery"
      estimated_monthly_cost: "$0.03-0.25 per run; inside the ceiling"
      notes: >
        RESOLVED 2026-07-20 against OpenRouter documentation, replacing an
        "unknown — potentially the dominant cost" estimate that was wrong.
        Parallel $0.001/request, Exa $0.005, Perplexity $0.005 — each including
        10 results. A ~20-work run makes 30-50 searches. Worst case search
        roughly DOUBLES per-run cost rather than exceeding tokens by an order of
        magnitude; a full run is $0.16-0.49 and $20 buys 40-125 runs.
        Routed through OpenRouter's web plugin rather than a direct provider
        account: cheaper ($0.005 vs Exa's $0.007 direct) and bills as OpenRouter
        credits, so one ceiling covers tokens and search together.
    - item: "Museum APIs and image acquisition"
      estimated_monthly_cost: "$0"
      notes: "ARTIC is free and already throttled and cached. Google Arts & Culture is scraped. Bandwidth only."
    - item: "Hosting and hardware"
      estimated_monthly_cost: "$0 incremental"
      notes: "Pi 4 and curation host already owned. Electricity only."

# =============================================================================
# TECHNICAL DECISIONS
# =============================================================================
# Every entry includes rationale.
# Each: { decision, rationale, alternatives_considered, date }

technical_decisions:
  architecture:
    - decision: "Split into a curation plane and a display plane, communicating over a defined contract."
      rationale: >
        AMENDED 2026-07-19, same day, after auditing the constraint that originally
        forced this. The split stands; its justification changed.

        Originally recorded as forced: every 3tears package declares
        requires-python >=3.14, while the IT8951 e-paper driver compiles Cython
        from 2023 sources and is targeted at 3.13/3.12, so the two could not share
        an interpreter. The audit (artifacts/3tears-integration-findings.md)
        confirmed 3.14 is genuinely required as shipped — but only by 16 mechanical
        source sites, all trivially fixable, with no third-party dependency
        imposing any floor above 3.10. The constraint is therefore REMOVABLE, and
        "forced" is no longer an honest rationale.

        The split is retained on its independent merits: the display plane does not
        want 3tears at all (it needs an HTTP client, samsungtvws, PIL, and the
        e-paper driver — three-tier entities are useless to it, and the
        shared-catalogue case that would justify them is the multi-pod coherence
        problem the operator ruled out); it matches the upstream/derived data
        contract in learnings.md; it makes "e-paper behind an interface" a process
        boundary; and it is what lets the display plane keep working when curation
        is down.

        AMENDED AGAIN 2026-07-20, second amendment. The clause "it moves gigapixel
        fetching, k-means over LAB arrays, and 4K compositing off a Pi 4" is
        RETIRED and must not be cited: the operator decided both planes run on the
        Pi, sharing a data directory, so nothing moved off it. The claim was also
        weaker than it read — the existing code downsizes to 2048x2048 before the
        colour work, so peak memory is a few hundred MB against 8 GB.

        What the co-location changes and does not change: the split's COST was the
        distributed-systems tax (a network contract, sync, two deployments), and a
        shared filesystem pays that down to near zero. Its BENEFIT — the display
        plane surviving a curation restart, upgrade, or crash — matters MORE on one
        box, not less, because the curation process gets restarted constantly
        during development and a single-process design would blank the TV each
        time. The split therefore got cheaper rather than less justified.
        Accepted trade: one hardware failure domain, and the two processes now
        compete for the Pi's resources.
      alternatives_considered:
        - "Single process on the Pi — no longer impossible once 3tears is relaxed, but rejected: it would put the whole curation stack, the LLM agent loop, and gigapixel image processing on a Pi 4, and forfeit the availability asymmetry that keeps art on the wall when curation breaks."
        - "Drop 3tears to stay single-process on 3.13 — viable, but forfeits the agent primitives the discovery work wants."
        - "Drop the e-paper panel to move the Pi to 3.14 — rejected; the operator chose to keep the panel behind an interface."
      date: 2026-07-19
    - decision: "Rotation is host-driven from the display plane (timed select_image calls), not delegated to the TV's native slideshow."
      rationale: >
        Decided 2026-07-19 after verifying the Samsung art API against
        samsungtvws source. The TV holds exactly one user-upload category and its
        native slideshow can only be scoped to a whole category — there is no
        content-id list parameter and no non-destructive way to remove an image
        from rotation. Using the native slideshow therefore forces
        delete-and-re-upload on every theme switch, roughly 5 seconds per file by
        the library examples' own budgeting: minutes of churn for the single
        interaction this product exists to make easy.

        Host-driven rotation — the pattern used by every production-grade example
        in the library, none of which call set_slideshow_status — keeps the full
        library on the TV and varies only which content ids the host selects.
        Theme switching becomes zero TV writes.

        The usual objection is that rotation becomes an availability dependency
        on the Pi. This product ALREADY pays that cost: the e-paper label requires
        the display plane to be running and reacting to image_selected callbacks,
        so a stopped Pi already means a stale label. The added failure is benign —
        the TV stays in art mode holding the last selected work.
      alternatives_considered:
        - "TV-native slideshow — no host dependency, but theme switching means delete + re-upload of every work."
        - "TV favourites (MY-C0004) as the active set — the library author states favourites cannot be applied to user uploads on 2022+ sets (unconfirmed on real hardware), and it would support only ONE active subset, not named themes."
      date: 2026-07-19
    - decision: "The theme manifest file is the ONLY channel from curation to display."
      rationale: >
        Decided 2026-07-20 once both planes landed on one host. A JSON document in
        the shared ART_ROOT, written atomically by curation (temp file + os.replace,
        which is atomic within a filesystem) and read by display on an mtime poll.
        It carries a schema version, the active theme, and an ordered list of
        entries: work id, path to the prepared 4K render, and the label FIELDS.
        Label text crosses; label rendering does not.

        This makes the availability norm structurally true rather than carefully
        maintained — there is nothing to be unreachable. The danger it guards
        against is the plausible second channel ("just fetch the label text live",
        "just ask curation which work is next"), each of which would work perfectly
        in development and in every test, because curation is up in development and
        in every test. The fallback path is the one never exercised until it
        matters.

        Consequence: single-writer per store falls out for free. Curation owns the
        catalogue, the image tree, and the manifest; display owns
        display-state.sqlite (TV content ids, upload status, panel geometry). No
        entity is written by both, so there is no coordination protocol and no
        conflict resolution — the hard part of two-writer systems is designed out
        rather than solved.
      alternatives_considered:
        - "Full local mirror on the Pi — the display plane could switch themes offline, but it is a sync problem with a conflict story and nothing asks the Pi to make curatorial decisions."
        - "Display polls curation over HTTP and caches the last good response — self-healing in principle, but it makes display a client of curation, so the norm is satisfied only by a fallback path that never gets exercised."
      date: 2026-07-20
    - decision: "The e-paper label is rendered on the display plane, not on curation."
      rationale: >
        Decided 2026-07-20 by the operator. Panel geometry stays owned by the plane
        that owns the panel, which is what the ratified data-model norm
        ("per-device runtime state never lives in the catalogue") already requires —
        and whose cited anti-pattern is the 2024 `label_file` named `_w648_h480`.
        Text rendering is cheap; it was gigapixel compositing that did not belong
        on a Pi, and that argument is retired anyway now that both planes share one.
        Secondary benefit: keeps the PyGObject/Pango/cairo system stack off the
        curation venv, where pycairo has no aarch64 wheel and would need a source
        build against libcairo2-dev.
      alternatives_considered:
        - "Render on curation alongside the 4K TV image — all image production in one place, but it puts panel geometry in the catalogue and couples curation to a specific device."
      date: 2026-07-20
    - decision: "Readiness is manifest membership, not a stored flag."
      rationale: >
        Decided 2026-07-20, resolving the open question by rejecting its premise —
        there is no single readiness. Catalogue readiness (renderable: an original
        exists, the fetch succeeded, the render is current, a mat colour is current)
        is curation's and is evaluated at manifest-build time in exactly one place.
        Device readiness (uploaded to the TV) is display's and lives in its own
        store. Neither is materialised on the work, so neither can drift.

        Because the manifest is the only thing display ever sees, it cannot select
        an unrenderable work — the recorded failure mode becomes structurally
        impossible rather than defended against. Theme membership reverts to being
        a purely CURATORIAL statement.

        Obligation accepted, and it is not optional: the manifest build REPORTS ITS
        EXCLUSIONS, per work and with a reason, surfaced in the curation UI. A work
        silently in a theme but not on the wall is exactly this product's
        characteristic failure, so the design must not trade a loud failure for a
        quiet one.
      alternatives_considered:
        - "A materialised is_displayable column recomputed on input change — cheap to query, but it is derived state that drifts the first time a recompute path is missed."
        - "A readiness state machine on the work — rigorous, but machinery for a conjunction only one caller needs."
      date: 2026-07-20
    - decision: "art_display's interactive commands ride in the manifest as a sequence-nonce directive, not on a second channel."
      rationale: >
        Decided 2026-07-20 in response to Critic finding R-17, which caught that
        api-contract's art_display actions (show_now, next) predated the ratified
        manifest-only norm and had no route to the plane that would execute them —
        unimplementable as written, and tool names are frozen, so cheap to settle
        now and expensive later.

        The manifest gains a directive block: a monotonically increasing `sequence`
        integer plus an optional `pinned_work_id`. Display acts once per advance —
        no pin steps to the next work, a pin jumps to that work and continues from
        there. This reframes the manifest from "the list" to DESIRED DISPLAY STATE,
        which is what makes commands expressible without a command channel.

        The norm survives literally and in spirit: one channel, one direction, and
        no availability coupling — display runs forever off the last manifest and
        merely stops receiving directives if curation dies. Nothing can be lost in
        transit because nothing is in transit; there is only state.

        NON-OBVIOUS CONSEQUENCE, recorded because it inverts the earlier reasoning:
        the manifest poll interval is now set by `next`, not by theme switching. A
        theme change tolerates seconds happily; a human pressing "next" and waiting
        three seconds concludes the product is broken. So the interval drops to ~1s
        — one stat() per second, free — where the list-only design had justified "a
        few calls a minute".

        Also follows: these actions return "the directive is written", never "the
        wall changed". Claiming the latter would assert something curation cannot
        observe, which is the false-success pattern this product already refuses.
      alternatives_considered:
        - "A separate command file or socket — the obvious shape, and exactly the second channel the norm exists to prevent."
        - "Drop show_now and next from the tool surface — honest, but it removes real capability to preserve a norm that turned out not to require the removal."
      date: 2026-07-20
    - decision: "The theme manifest carries a schema version; the curation-to-display stability exemption is narrowed."
      rationale: >
        Decided 2026-07-20, resolving a contradiction the Critic raised on
        2026-07-19. api-contract exempted this channel from any stability
        obligation as "single consumer, deployed together", which is incompatible
        with the availability norm — deployed-together and survives-independently
        cannot both be true without saying what display holds and how stale it may
        be.

        Resolution is neither exemption nor a full compatibility regime: the
        manifest carries a schema version, additive changes are free, breaking
        changes bump the major, and display REFUSES a manifest whose major it does
        not recognise, keeping the one it has and logging at ERROR.

        Skew is real even co-located: the two processes restart independently, so
        an upgrade has a window where new curation has written a manifest that old
        display is still reading, and a reboot mid-upgrade extends that window to
        "until someone notices". Without the version field the failure is a
        misparse rendering wrong art or a crash loop blanking the wall; with it,
        the failure is a logged refusal and yesterday's theme still on the wall.
      alternatives_considered:
        - "Keep the blanket exemption — simplest, but it leaves the contradiction standing and the failure mode undefined."
        - "Full compatibility regime with negotiation — disproportionate for one consumer on the same host."
      date: 2026-07-20
    - decision: "The display plane must keep functioning when the curation plane is unavailable."
      rationale: "The household experiences only the TV. Curation downtime is invisible; display downtime is a blank wall. This asymmetry is the main reason the split is a benefit rather than a cost."
      alternatives_considered: ["Display plane as a thin client that fails when the server is down — rejected; inverts the availability priority."]
      date: 2026-07-19
  technology:
    - decision: "Use 3tears three-tier entities in an L1-only (SQLite) configuration, with no NATS and no Postgres."
      rationale: >
        Verified against the source rather than assumed (artifacts/3tears-integration-findings.md):
        CollectionRegistry initialises all three tiers to None and injects only what
        is configured; BaseCollection guards every L2 use and emits a one-shot
        warning when the client is absent — the anti-log-spam machinery proves the
        no-broker path is designed for, not accidental. The L3 DurableStore protocol
        is explicitly the seam for non-SQL backends, and scriob's GitL3Backend is a
        working precedent. This satisfies the operator's "no NATS or anything crazy"
        constraint while keeping the 3tears entity model.
      alternatives_considered:
        - "Full 3tears stack with NATS + Postgres — rejected by the operator; solves multi-pod coherence problems this product does not have."
        - "No 3tears at all — viable and simplest, but forfeits shared foundation with the operator's other projects."
      date: 2026-07-19
    - decision: "Use 3tears-models for LLM access, routed through OpenRouter."
      rationale: "3tears-models depends only on media-contracts and observe — no core, no infrastructure — and already carries langchain-openrouter. Multi-provider routing directly enables the cheap-by-default / escalate-on-request pattern that keeps discovery spend bounded."
      alternatives_considered:
        - "Direct Anthropic or OpenAI SDK — fewer layers, but no provider routing and no shared foundation."
        - "Keep openai==1.37.1 / gpt-4o as in ai.py — rejected; the pin and the model are both from mid-2024."
      date: 2026-07-19
    - decision: "Build the MCP server on the official `mcp` SDK directly, not on `3tears-mcp`."
      rationale: >
        Decided 2026-07-19 when MCP became a core surface. `3tears-mcp` depends on
        `3tears` core, `3tears-epoch`, and `3tears-nats`, and `mcp/auth.py`
        imports `EpochClient`/`EpochListener` at module scope — so taking it would
        drag NATS into a product whose operator explicitly ruled it out.

        What `3tears-mcp` adds over the raw SDK is an RBAC-gated `McpServer` with
        pluggable identity and authorizer protocols. This product has ONE
        principal. There are no roles to gate, so the entire value-add is
        inapplicable, and `3tears-mcp` depends on `mcp>=1.27` anyway — the same
        official SDK, reachable directly.

        This resolves the open question about running 3tears MCP without a broker
        by making it moot rather than by answering it.
      alternatives_considered:
        - "3tears-mcp — brings RBAC this product cannot use, at the cost of NATS + Postgres."
        - "Custom JSON-RPC surface instead of MCP — rejected; MCP is the requirement, and Claude Code speaks it natively."
      date: 2026-07-19
    - decision: "Defer 3tears agent memory."
      rationale: "It depends on pgvector, a PostgreSQL extension — the one 3tears capability that genuinely forces infrastructure. Deferring it is what keeps the whole curation plane infrastructure-free. Revisit only if Postgres appears for another reason."
      alternatives_considered: ["Run Postgres for agent memory — rejected as disproportionate for one household."]
      date: 2026-07-19
    - decision: "MCP transport is streamable HTTP, and the MCP server is mounted in the same ASGI application as the curation UI's HTTP API."
      rationale: >
        Decided 2026-07-19. The transport is effectively forced: Claude Code runs on
        the operator's laptop while the catalogue and ART_ROOT live on the curation
        host reached over an overlay network, and stdio requires the client to SPAWN
        the server locally. Co-mounting is then the choice that makes the
        thin-binding norm structurally easy — one process, both surfaces over the
        same in-memory service layer — rather than a rule someone has to remember.
        Cost accepted: the MCP surface goes down with the UI process, which is
        tolerable because curation-plane downtime is already defined as invisible to
        the household.

        SCOPE OF THIS DECISION: it commits to co-mounting in ONE ASGI application,
        not to a particular framework. No web framework has been chosen and none is
        implied — see open_questions. Flagged on 2026-07-19 review after this
        decision was written as though ASGI were already settled.
      alternatives_considered:
        - "stdio — impossible across the host boundary; the client cannot spawn a server on another machine."
        - "Separate MCP process — needs its own path to the catalogue and reintroduces the divergence the service-layer norm exists to prevent."
      date: 2026-07-19
    - decision: "Five action-dispatch MCP tools with registry-generated definitions, rather than fine-grained per-operation tools."
      rationale: >
        Decided 2026-07-19 against three inputs: the operator's two production MCP
        servers (cordyceps, public and in wide use, 7 tools; hallucinote, private,
        13 tools), Anthropic's published tool-design guidance, and MCP spec revision
        2025-11-25. Enumerating what "parity with the web UI" actually requires gave
        ~28 operations; consolidating to five noun-shaped tools with a required
        `action` parameter lands inside the 1-15 range Anthropic identifies as the
        point where one-tool-per-action stops paying.

        The decisive detail is that definitions are GENERATED from a registry —
        one record per action carrying description, params, example and tips, from
        which the wire schema, validation, help output and error messages are all
        derived. That is what makes them provably consistent rather than consistent
        by discipline, and it gives the service-layer norm a structural home
        (declarative action records cannot contain logic; handlers do the work).

        Consolidation is vertical only. A generic art_request(method=, path=)
        multiplexer is the anti-pattern Anthropic's connector review rejects, and it
        would put routing logic in the binding.
      alternatives_considered:
        - "Fine-grained tools, one per operation — ~28 tools; past the point where tool selection degrades, and rejected by the operator's own field experience."
        - "Split read tools from write tools per Anthropic's Directory review criteria — not binding (this will never be listed), and the readOnlyHint auto-approve benefit it protects is retired by allowlisting the server once. The money-spending operation is isolated on its own tool instead, which is the carve-out that actually matters."
      date: 2026-07-19
    - decision: "FastAPI serves the curation plane, with the MCP app co-mounted in its ASGI application."
      rationale: >
        Decided 2026-07-20, after establishing that NEITHER of the operator's
        production MCP servers is a precedent — hallucinote is stdio-only
        (FastMCP with no transport arg), and cordyceps is C# on a hand-rolled
        System.Net.HttpListener with if/else path dispatch. So this was decided on
        merits rather than inherited, which is worth recording because the previous
        session's pattern was to defer to those servers' practice.

        FastAPI is Starlette underneath, so the SDK's documented mounting story
        applies verbatim, and `FastMCP.session_manager`'s own docstring names
        "mounting multiple FastMCP servers in a single FastAPI application" as the
        supported advanced use case. The UI API is recorded as needing typed,
        paginated, partial data — that is pydantic response models — and pydantic
        is already in the tree via 3tears-models/langchain, so marginal cost is
        small. Dependency injection makes the thin-binding norm structurally easy
        rather than a rule to remember. It is a library, not infrastructure, so it
        does not offend the "no NATS or anything crazy" constraint.

        INTEGRATION HAZARD, recorded because it is silent and total: Starlette does
        NOT run a mounted sub-app's lifespan, so Mount("/mcp",
        app=mcp.streamable_http_app()) fails EVERY request with "RuntimeError: Task
        group is not initialized" unless the host app enters session_manager.run()
        in its own lifespan (mcp/server/streamable_http_manager.py:143-144). Two
        related constraints: session_manager raises if touched before
        streamable_http_app() has been called, and .run() may be entered only once
        per instance.
      alternatives_considered:
        - "Starlette directly — minimal dependency and the SDK already hands back Starlette apps, but it means hand-writing validation and JSON shaping that pydantic gives free, and validation logic leaks into handlers, which the service-layer norm forbids."
        - "FastMCP.custom_route alone, with no separate web framework — fewest moving parts and no mounting hazard, but it is a minimal API registered at lowest route precedence, making the UI surface a second-class citizen of the MCP server rather than a peer."
      date: 2026-07-20
    - decision: "The in-UI agent is an MCP client, not an in-process caller."
      rationale: >
        Decided 2026-07-19 by the operator. Either way the agent must be taught a
        surface, and MCP describes itself, so the teaching is free. The stronger
        argument is scope: making the server the unit of "an art library on a
        system" lets one agent manage several, promoting multiple libraries from an
        accommodate-only concern toward a design driver.

        Explicitly NOT implied: routing the web UI's own direct controls through
        MCP. Tool results are shaped for a model to read while a UI wants typed,
        paginated, partial data. Location transparency belongs in the service layer,
        beneath both surfaces.
      alternatives_considered:
        - "In-process service calls for the in-UI agent — fewer layers and no serialization, but forfeits multi-library and means the agent binds a different surface than external clients, which is the parity split MCP exists to prevent."
      date: 2026-07-19
    - decision: "Long-running discovery uses start-and-poll with progress notifications, not MCP Tasks."
      rationale: >
        Decided 2026-07-19 after verifying client behaviour rather than assuming it.
        MCP's Tasks primitive (SEP-1686) landed in spec revision 2025-11-25 marked
        EXPERIMENTAL, and Claude Code closed the request to support it as NOT
        PLANNED — so declaring execution.taskSupport "required" would break the
        product's primary client outright.

        Claude Code's actual behaviour sets the shape: a call that sends no response
        and no progress notification for 5 minutes on HTTP transport is ABORTED, and
        a call still running after 2 minutes is auto-backgrounded (>= 2.1.212). So
        emitting notifications/progress during phase 2 is load-bearing — it is what
        keeps the connection alive — and the run handle must come back immediately.
        hallucinote reaches the same conclusion independently and supplies a
        calibrated number: a 45s status long-poll sized under a 60s tool timeout.

        AMENDED 2026-07-20. Start-and-poll STANDS; the claim that progress
        notifications are "load-bearing — it is what keeps the connection alive" is
        WITHDRAWN, on two pieces of evidence found while reading the SDK.

        First, the mechanism can silently do nothing: Context.report_progress
        no-ops if the client did not send a progressToken
        (mcp/server/fastmcp/server.py:1170-1173). Relying on it to prevent a
        5-minute abort means relying on client behaviour we do not control, with a
        failure mode invisible until the call dies.

        Second, it is unnecessary. The run handle returns immediately, so the only
        long call is the status long-poll capped at 45s — nowhere near the
        2-minute auto-background or 5-minute idle-abort thresholds. Nothing is ever
        idle long enough to need keeping alive.

        Corroboration: NEITHER of the operator's production servers emits progress
        notifications. hallucinote backgrounds work and exposes a blocking `status`
        action; cordyceps is stateless JSON with no SSE stream, so server-to-client
        notifications mid-call are structurally impossible there. Both arrived at
        polling independently.

        Progress notifications may still be emitted as a UX nicety where a client
        does send a token. They are not a correctness dependency, and nothing may be
        designed as though they were.
      alternatives_considered:
        - "MCP Tasks (SEP-1686) — experimental, and unsupported by the primary client; taskSupport 'optional' is declared as forward-looking, 'required' would break Claude Code."
        - "Blocking call for the duration of the run — killed by the 5-minute idle abort."
      date: 2026-07-19
    - decision: "Candidate thumbnails are returned inline as MCP image content blocks, capped at 400px on the long edge."
      rationale: >
        Decided 2026-07-19. This DEPARTS from both of the operator's own production
        servers, which return file paths plus a "use Read tool to view" hint and
        never emit image blocks — so the departure is recorded rather than assumed.

        The reason the established pattern does not transfer: both of those servers
        are LOCAL (cordyceps binds 127.0.0.1, hallucinote is stdio), so a returned
        path works because client and server share a filesystem. This product's do
        not. A path returned by the curation host is meaningless on the laptop, and
        it fails by returning a plausible-looking result the client cannot act on.

        The requirement behind it is the review gate: its justification is content
        appropriateness, which only a person LOOKING AT THE PICTURE can judge.
        Budget: image cost is about (w*h)/750 tokens against Claude Code's 25,000
        token result cap (10,000 warning), and the per-tool ceiling raise via
        _meta anthropic/maxResultSizeChars covers TEXT ONLY. At 400px a 40-work
        batch costs roughly 6.4k tokens.
      alternatives_considered:
        - "File paths plus a read hint, as in cordyceps/hallucinote — breaks across the host boundary."
        - "HTTP URLs to the curation plane — would need one client fetch per image, i.e. 40 extra round trips for a batch."
        - "resource_link content blocks — spec-sanctioned and token-cheap, but client support is uneven and it still costs a read per image."
      date: 2026-07-19
  data_model:
    - decision: "The mat is specified in physical units with a weighted bottom margin; panel geometry is a DEPLOYMENT VALUE; the resolution floor is a minimum rendered size in inches; display_fit is derived, never stored; nothing is ever upscaled."
      rationale: >
        Decided 2026-07-20 by the operator. One decision chain, because each part
        forced the next.

        MAT GEOMETRY. Specified in inches with the bottom margin weighted larger
        than the top — the conservator's convention, since a true-centred image
        reads as sitting low. This is what "museum-quality mat" has to mean if it
        means anything. It is also a real change: the 2024 pipeline calls
        image.thumbnail((3840,2160)), so the mat is aspect-ratio RESIDUE and a 16:9
        source gets no mat at all — which directly contradicted data-model.md's
        stated premise that "the artwork sits inside a mat, the mat is the
        deliberate frame". The premise was aspirational and nothing implemented it.

        PANEL GEOMETRY IS A DEPLOYMENT VALUE, not a constant. The operator's panel
        is 42" and explicitly instructed that nothing may depend on that, because
        other people will run this on other sizes. This falls under the existing
        ratified "no hardcoded deployment values in source" norm, and it makes panel
        dimensions the SECOND value both planes must agree on after ART_ROOT — a
        quieter mismatch than ART_ROOT's and therefore worse, because nothing fails:
        the mat is simply the wrong width.

        THE FLOOR IS PHYSICAL, and this is why it was never answerable as filed. The
        question asked for a minimum resolution; adequacy is defined against the
        artwork box, the box is defined by panel and mat, and both are per
        deployment. So there is no single number — there is a formula, expressed in
        the same units as the mat: a minimum rendered size on the wall. It scales
        with the panel automatically. On a 42" (~105 ppi) a 12" floor is ~1260 px on
        the long edge; on a 75" (~59 ppi) the same 12" floor is ~708 px.

        BELOW THE FLOOR: not rejected, not hidden. Phase 2 does not auto-select a
        below-floor instance; the review grid shows it labelled with its rendered
        physical size and the curator may select it anyway. If every instance is
        below floor the work lands at resolution_status='unresolved' — already
        first-class and never silently omitted (constraint 9) — and stays eligible
        for re-search. The instance-vs-work suppression split this rests on is the
        Q11 distinction and the machinery landed earlier the same day, so nothing
        new was invented. The load-bearing detail: A THUMBNAIL CANNOT CONVEY
        RESOLUTION — 900 px and 6000 px look identical in a grid — so the "a human
        saw the artwork" review gate does not by itself prevent hanging a postage
        stamp. The rendered-inches figure is what makes the judgement possible.

        DISPLAY_FIT IS DERIVED, NEVER STORED, which AMENDS constraint 12. A verdict
        computed once at acquisition is a stored judgement about a machine the
        curation plane does not own, and it goes silently wrong when the TV changes.
        width and height stay stored — they are panel-independent facts. The old
        constraint's real intent ("policy in one place, not implicit in each
        renderer") is now met by the service-layer norm ratified the same day rather
        than by storage. Third application of derived-not-stored after readiness and
        the re-search states; it is effectively a house pattern now.

        NO UPSCALING. image.thumbnail already never upscaled and "acquisition at
        gallery resolution" is a product promise. Upscaling is the one option that
        actively misrepresents quality — it converts an honest "this image is small"
        into an apparent rendering fault. Consequence: display_fit's `upscaled`
        value is REMOVED rather than reserved, since a declared state with no
        producer is the defect the re-search review flagged hours earlier.
      alternatives_considered:
        - "Fixed pixel border — simplest, needs no panel dimensions, but the number is arbitrary, means something different on every panel size, and cannot be described to anyone as a mat width."
        - "Mat proportional to the artwork — keeps large works large, but inverts framing practice: conservators give SMALL works proportionally MORE mat, so it would look wrong exactly where matting matters most."
        - "Keep 2024 fit-to-canvas — zero regression risk on the 41-work corpus since it IS current behaviour, but a 16:9 work gets no mat, 'museum-quality mat' stays false, and the floor stays uncomputable forever."
        - "Hard-filter below-floor images at discovery — cleanest grid, but silently discards the only existing scan of an obscure work and the curator never learns it existed."
        - "Keep display_fit stored with the panel it assumed, so staleness is detectable — rejected as storing a cached answer plus its cache key."
        - "Keep display_fit stored and rebuild on panel change — preserves constraint 12 literally, but adds an operational step whose omission is silent, on a product whose defining constraint is silent failure."
        - "Conventional Lanczos upscaling — fills the box, but a 900px source at 3316px is visibly soft at wall distance and a curator cannot tell a bad source from a bad renderer."
      date: 2026-07-20
    - decision: "Rights metadata is display-only and gates nothing; it is surfaced as a provenance and source-quality signal."
      rationale: >
        Decided 2026-07-20 by the operator, closing a question raised in priority on
        2026-07-19 when the corpus became deliberately in-copyright.

        Recording was never in question — constraint 13 already requires
        rights_status on every source including 'unknown', because "we did not
        check" and "we checked and could not tell" are different facts. What was
        open was whether it GATES.

        It does not. Private household display keeps the legal stakes genuinely low,
        and the operator's own framing was that this wants a recorded decision
        rather than a compliance regime. A hard filter would also contradict a
        decision already made, since the corpus is deliberately in-copyright.

        The reframing that makes it useful anyway: rights status is a PROVENANCE
        signal, not merely a legal one. A holding institution's own public-domain
        scan is usually the authoritative file; unknown-rights images are more often
        downstream reproductions. So it earns its place in the review grid on source
        quality grounds regardless of legal posture.

        REOPEN TRIGGER, recorded so it is recognisable rather than rediscovered: the
        product gaining sharing or export, or the catalogue itself becoming public.
        Either changes the analysis.
      alternatives_considered:
        - "Warn and require override on restrictive or unknown rights — creates an audit trail, but rights are populated for 5 of 41 works today so nearly every acceptance would trip a warning that means nothing actionable."
        - "Hard filter at discovery — most conservative legally, but guts the stated product and silently hides exactly the works the curator wants."
      date: 2026-07-20
    - decision: "The re-search is a DiscoveryRun with kind='resolve'; its three conflated situations are derived, not stored; and awaiting_better_image is reachable only via reject_image."
      rationale: >
        Decided 2026-07-20 by the operator, resolving three interacting defects the
        Critic raised and the prior session deliberately deferred rather than
        patching. They were one question because fixing any one alone just moves the
        ambiguity — and in the event, fixing the first largely dissolved the second.

        (1) THE RUN ROW. resolve_images was a paid, minutes-long operation creating
        no row at all, so the one tool the design says is the only one that spends
        money had no handle to poll, no cancel, no cost of its own, and no guard
        against concurrent double-submission of the same work ids. It now creates a
        DiscoveryRun with kind='resolve' and parent_run_id, entering directly at
        resolving_images (phase 1 already happened on the parent). This reuses
        status, cancel, spend attribution and halted_by_budget rather than inventing
        a second, weaker handle beside them. Constraint 14 refuses work ids already
        covered by an in-flight resolve run, naming them rather than silently
        deduplicating.

        (2) NO NEW STATES. awaiting_better_image was carrying "not yet re-searched",
        "re-search running" and "re-search found nothing" as one value. The fix is
        not more enum values but separating curator INTENT from job STATE:
        awaiting_better_image now means exactly "the curator wants this work and the
        current instance is not good enough", which does not change when a job
        starts or ends. "Running" derives from the run row (1) made exist; "found
        nothing" is resolution_status='unresolved', which constraint 9 already
        forbids omitting or presenting as accepted-able.

        This deliberately follows the ratified derived-not-stored readiness decision
        rather than re-litigating it. A stored `resolving` verdict would be a second
        truth beside the run row, and a crashed resolve run would strand a work in
        it forever with nothing to reconcile against.

        ACCEPTED COST, named rather than discovered later: resolution_status is
        REDEFINED from "phase 2 found no credible instance" to "the latest
        resolution attempt found none". Written into data-model.md explicitly,
        because a widened meaning nobody records is how the next drift starts. It
        only reaches unresolved when every instance is rejected; if unrejected
        instances remain, constraint 8 selects the next and the work returns to
        pending.

        (3) SINGLE ENTRY POINT. set_verdict and reject_image both reached
        awaiting_better_image and only reject_image set rejected_at — so a work sent
        there by set_verdict had no suppressed instance and a re-search could
        legitimately return the image just rejected. That is the Q11 suppression
        failure reappearing on the instance scope. set_verdict no longer accepts the
        value; reject_image is the only way in, so the path that sets the verdict and
        the path that sets rejected_at are the same path. Impossible rather than
        defended, and it matches the scope boundary the tools already draw.

        Knock-on recorded in nonfunctional-requirements.md: the per-run search cap
        now bounds each ATTEMPT rather than a work's lifetime, since re-searches are
        runs. Accepted — each is a deliberate human act on named ids, a different
        risk shape from an agent loop running away inside one run, and the monthly
        ceiling still bounds the aggregate and cannot be multiplied by creating more
        runs.
      alternatives_considered:
        - "Split into three verdicts (resolving, no_better_image) — most legible with zero derivation and no redefinition of resolution_status, but `resolving` duplicates the run row's truth and a crashed run strands the work there permanently."
        - "Derive `running` but add a stored `no_better_image` terminal — avoids the redefinition, but uses two mechanisms for three situations and is harder to explain than either pure option."
        - "Let set_verdict keep awaiting_better_image and set rejected_at implicitly — fixes the bug but leaves two entry points, so the next writer can reintroduce it."
      date: 2026-07-20
    - decision: "The review gate is that a human SAW THE ARTWORK — not that a surface was withheld. Accepting is available over MCP, and any reviewing surface must show the image."
      rationale: >
        AMENDED 2026-07-19, same day, superseding "agents never auto-accept" as
        stated in the decision below. The two could not both hold: the product
        brief promised that EVERY content-management operation is an MCP tool while
        also declaring the review gate "not automatable by any surface, agent or
        human". Accept/reject is a content-management operation.

        Resolved in favour of the gate's actual content. Its durable justification
        is content appropriateness (see the decision below, which is otherwise
        unchanged and still correct), and the only thing that prevents inappropriate
        work reaching a wall is a person LOOKING AT THE PICTURE. Withholding the
        tool from agents does not achieve that; it just moves the click. Meanwhile
        accepting on the strength of a title and a rationale — which is what a
        text-only agent surface would permit — IS the failure the gate exists to
        stop, and the web UI would never have allowed it.

        So: art_review(action='set_verdict') exists, and the binding requirement
        moves to the result shape — candidate listings return thumbnails. See
        technical_decisions.technology on inline images.

        HONEST COST, recorded because it voids a security bound: the api-contract's
        prompt-injection analysis previously opened with "agents cannot auto-accept,
        every addition stops at curator review". That is no longer true. The
        replacement bounds are weaker and are stated as weaker — the spend cap still
        fails closed, tool authority is still narrow, and acceptance is visible and
        fully reversible with the curator present in the session. "Visible and
        reversible" is a smaller claim than "cannot", and leaving the old sentence
        in place would have let a future reader build on a stale guarantee.
      alternatives_considered:
        - "No verdict tool on MCP — strongest injection story, but parity gets a hole and 'every operation' becomes a lie needing rewrite."
        - "Reject-only on MCP — asymmetric (declining can never put art on a wall); triages a batch but leaves half of parity gone and is odd to explain."
        - "Verdict tool, text-only results — simplest and cheapest, but the curator accepts on titles alone, which is precisely the named failure."
      date: 2026-07-19
    - decision: "Agent-initiated additions always queue as candidates; agents never auto-accept into the active collection."
      rationale: >
        SUPERSEDED IN PART 2026-07-19 by the decision above — agents DO now hold a
        verdict tool, so the "never auto-accept" clause no longer holds. Everything
        below about WHY the gate exists survives intact and is the reasoning the
        amendment was decided against; it is retained rather than rewritten because
        the three-reason analysis is what made the correct resolution findable.

        Confirmed 2026-07-19, and reframed by the operator the same day in a way
        that strengthens it. "Add all of Salvador Dali's most famous works" is a
        statement that the curator WANTS this, not an expectation that it appears
        on the TV without further steps — the same shape as an agent confirming
        before deleting a batch of files.

        THREE reasons the gate exists, in ascending order of durability:

        1. Spend. Weakest on its own — the ceiling is USD 20 and a run costs
           roughly USD 0.13, so this argument would not survive someone arguing
           that auto-accept is cheap and convenient.
        2. Taste. The curator's judgement is the product; delegating it defeats
           the point of curation.
        3. CONTENT APPROPRIATENESS — the load-bearing one. Discovery searches the
           open web, so a bad search can surface work that is explicit,
           disturbing, or simply wrong for a domestic space. That work would then
           appear on a wall in a shared home, seen by household members and
           guests who never opted in, possibly while the curator is not present
           to notice.

        Note the failure class is unlike data loss: fully reversible, but
        PUBLICLY VISIBLE for as long as it lasts, and visible to people who have
        no interface with which to object. That asymmetry is why the gate is not
        a spend control that could be relaxed once spend looks safe.

        The honest cost: an agent cannot finish that request end to end. It gets
        works found and staged, but the wall does not change until the curator
        looks. Accepted deliberately, and the operator's own framing is that this
        is correct behaviour rather than a limitation.

        No new entity is needed — `Candidate.verdict = pending` already expresses
        this. What the model gains is provenance: a DiscoveryRun must record which
        client initiated it, so "why did 40 Dali candidates appear" is answerable.

        HISTORICAL NAMES: `Candidate` was split into `CandidateWork` and
        `CandidateImage` later the same day; the equivalent of the state named here
        is `CandidateWork.verdict = pending`. Left unrewritten because this block is
        retained as the reasoning the amendment above was decided against, not as a
        description of the current model.
      alternatives_considered:
        - "Bounded auto-accept behind an explicit flag — completes the request, but changes the wall without the curator seeing it."
        - "Auto-accept into a non-active staging theme — keeps the gate while letting the agent finish; rejected as a third state duplicating what `candidate` already means."
        - "Trust by caller (Claude Code auto-accepts, in-UI agent queues) — rejected: exactly the parity split the MCP requirement exists to avoid."
      date: 2026-07-19
    - decision: "Rebuild the catalogue through curation rather than migrating all.json."
      rationale: >
        The existing 41 records have three known defects (identity keyed on the
        source URL, per-device TV state embedded in the record, semi-structured
        artist_details), and every work is re-fetchable from its source URL. The
        existing artworks become worked examples that seed curation, and their
        hand-tuned mat colours become the regression corpus for the mat engine.
      alternatives_considered:
        - "Full schema migration with re-identity — more up-front cost for data that is cheaply re-derivable."
        - "Leave all.json as-is — carries all three defects into the new design."
      date: 2026-07-19
    - decision: "Per-device runtime state never lives in the catalogue."
      rationale: "tv_content_id, tv_content_thumb_md5, and geometry-stamped label filenames are facts about one specific television and one specific panel, not about the artwork. Keeping them out is what lets the catalogue be plane-independent and lets derived artifacts regenerate per-device (learnings.md, Data and cache contract)."
      alternatives_considered: ["Keep them in the record as today — the defect being corrected."]
      date: 2026-07-19
    - decision: "A WORK is distinct from an IMAGE of it, at every stage. Discovery is two-phase: intent resolves to works, then each work is searched for image instances and one is selected as canonical."
      rationale: >
        Stated by the operator 2026-07-19 as a central product requirement, not an
        implementation detail: "if I say Dali's persistence of memory, it is a
        complete failure if I get 10 copies of it and am supposed to only check
        approve on one."

        The distinction must hold PRE-acceptance, because that is exactly where the
        duplication appears. So Candidate splits into CandidateWork (produced by
        phase 1) and CandidateImage (produced by phase 2), mirroring the
        Artwork/Source shape the catalogue already had — which makes acceptance a
        promotion rather than a transformation.

        Three consequences beyond the obvious one:

        1. The cost estimate stops being a guess. Phase 2 costs roughly one search
           per work, so the moment phase 1 finishes the count is known and the
           estimate is COMPUTED against a real list.
        2. It resolves the target_candidate_count deferral with an option none of
           the three recorded ones anticipated: the work list IS the count, and it
           is trimmable rather than set in advance. Nothing is stored.
        3. Phase 2 VERIFIES phase 1. Models invent plausible artwork titles; a work
           with no credible instance is evidence of exactly that, so unresolved is a
           first-class outcome rather than an absent row.

        Collapse bias: aggressive, but nothing is discarded — losing instances are
        retained as non-primary rows. That is what makes over-merging recoverable
        and inspectable, which in turn makes biasing toward collapse safe. The
        residual hard case (same title, same artist, genuinely different object —
        Munch's four Screams, Monet's Haystacks) is handled by declining to collapse
        when institution AND dimensions AND date all differ.
      alternatives_considered:
        - "One flat Candidate per found image, as originally modelled — the failure the operator named."
        - "Resolve instances only after acceptance — cheaper, but the curator would approve a work without seeing what they are getting, which the review gate forbids."
      date: 2026-07-19
    - decision: "Review carries a third verdict — accept the work, reject the IMAGE, re-search — and suppression therefore has two scopes."
      rationale: >
        Decided 2026-07-19. Approving a work bundles two judgements that fail
        independently: do I want this work, and is this image good enough. "Yes,
        Persistence of Memory, but not that 900px poster scan" is ordinary, and an
        accept/reject binary cannot express it.

        The trap this creates is the important part. Rejecting a WORK must suppress
        the work; rejecting an IMAGE must suppress only that image and explicitly
        leave the work eligible. One suppression key for both means asking for a
        better scan silently blacklists the painting — invisible until a curator
        wonders why something they asked to keep never came back. Modelled as
        CandidateWork.work_dedup_key versus CandidateImage.rejected_at, and stated
        as a constraint so the two cannot be unified later by someone tidying up.
      alternatives_considered:
        - "Reject-and-re-add manually — puts the curator back in the position of re-issuing an intent to recover a work they already approved of."
      date: 2026-07-19
    - decision: "The phase-1 work list is gated for approval only when the resolved WORK COUNT crosses a configured threshold."
      rationale: >
        AMENDED 2026-07-20. This decision originally read "...when the phase-2 COST
        ESTIMATE crosses a configured threshold". The gate stands; what it triggers
        on changed, and this canonical entry was missed when the amendment was
        applied elsewhere (caught by Critic finding R-3).

        Why count and not cost: once real per-run costs were measured ($0.16-0.49),
        a dollar threshold was gating on the axis that does not matter — it either
        never fires, or fires at a number that means nothing to a curator. The
        judgement the gate exists to invite is SCOPE: "you asked for Dali and I
        found 200 works — really?" Count is what a curator can act on at a glance;
        "$1.00" does not tell them the run found 200 works.

        The cost estimate is still computed and still shown (it is what makes phase
        2 authorisable at all) — it is simply not what opens the gate.

        Chosen by the operator 2026-07-19 from four options. Always-gate gives the
        strongest cost control but demands two review passes per run, cutting
        against the recorded constraints that curation happens in short sessions and
        must never feel like sysadmin work. Never-gate means paying to resolve images
        for works that would have been struck from the list. The threshold keeps
        cheap runs frictionless and stops the expensive ones.

        Two consequences. DiscoveryRun gains an awaiting_approval state and a
        DECLINED terminal state — distinct from both failed (something broke) and
        halted_by_budget (the cap fired), because collapsing a deliberate choice
        into a malfunction is the same mistake this model already refuses to make
        for halted_by_budget. And approval_required is STORED per run rather than
        re-derived, because the threshold is configuration and configuration changes;
        a run that stopped last month must still read as having stopped.

        The threshold value itself is a deployment value and must not be hardcoded —
        see the project-preferences norm. Open question recorded.
      alternatives_considered:
        - "Always two gates — strongest control, worst fit for short leisure sessions."
        - "One gate at the end — simplest, matches the committed one-batch-reviewed-as-a-grid decision, but pays for image resolution on works that would have been cut."
        - "No gate, but phase 1 exposed as its own operation — pushes the discipline onto the caller rather than the system."
      date: 2026-07-19
  integrations:
    - decision: "Discovery searches museum/public-domain collections AND the contemporary web (gallery sites, prize announcements, artist portfolios)."
      rationale: >
        Confirmed 2026-07-19. The curator's motivating example — "find recent
        award-winning art" — cannot be satisfied from institutional collections
        alone, so restricting to museums would defeat the product's purpose.
      alternatives_considered:
        - "Museum/public-domain only — keeps the existing gigapixel + IIIF + metadata-API pipeline intact and rights trivial, but makes 'recent award-winning' undeliverable."
        - "Contemporary-first — rejected; would forfeit the gigapixel museum path that produces the best output."
      consequences: >
        This is a genuine scope expansion, not a source list. The existing
        acquisition pipeline assumes public domain, IIIF tile servers, structured
        metadata APIs, and gigapixel originals. Contemporary web sources satisfy
        NONE of those: typically web-resolution JPEGs, in copyright, no metadata
        API, no tile server. Three things follow:
          1. A second acquisition path with different resolution expectations.
          2. A minimum-resolution policy — the mat engine's premise is that the
             artwork sits INSIDE a mat at native resolution rather than being
             upscaled into one. A 1200px press image on a 3840x2160 canvas either
             occupies a small island or must be upscaled.
          3. Rights handling stops being cosmetic. Personal display keeps the
             stakes low, but "captured and ignored" is no longer a defensible
             default when the corpus is deliberately in-copyright.
          CONSEQUENCES 2 AND 3 WERE RESOLVED 2026-07-20; see
          technical_decisions.data_model. Note that (2)'s stated premise — "the mat
          engine assumes native resolution inside a mat" — was ASPIRATIONAL when
          written: the 2024 code's image.thumbnail() makes the mat aspect-ratio
          residue, so a 16:9 source got no mat at all. The mat geometry had to be
          decided before the resolution floor could be, and neither was filed as a
          question until 2026-07-20.
      date: 2026-07-19
    - decision: "Curation UI is LAN-only, reached remotely via an overlay network (Tailscale/VPN) rather than by public exposure."
      rationale: >
        Confirmed 2026-07-19. The network layer carries the trust boundary, so the
        application does not need authentication, TLS termination, rate limiting,
        or public-surface hardening. For a single-operator household tool this is
        the proportionate answer and it keeps the security model genuinely short.
      alternatives_considered:
        - "Public internet exposure — would make authn, TLS, rate limiting, and API-key protection real requirements for one user."
        - "Strictly LAN with no remote access — simpler still, but no access while away."
      date: 2026-07-19
  operational:
    - decision: "RATIFIED as a binding norm: operation logic lives only in the service layer; MCP tools and HTTP handlers are thin bindings."
      rationale: >
        Ratified by the owner 2026-07-20, after Critic review found it was being
        CITED as binding and Critic-enforced in four artifacts, and leaned on five
        times in this file, with no recorded ratification anywhere — no
        technical_decisions entry, no Direction home, no dated marker, no
        change-log birth record. Its three peer norms all had them. The trail was
        also circular: product-brief pointed at project-preferences, which pointed
        nowhere, under a banner declaring every row inferred from the 2024
        codebase — which cannot be true of a norm about a service layer and MCP
        surface that codebase does not contain.

        The norm itself was never in dispute; what was missing was the vetoable
        decision. Now given a Direction home in architecture.md with a dated
        marker, and the preferences row demoted to the pointer it already claimed
        to be.

        WHY IT BINDS: the product requires the MCP surface at parity with the web
        UI, but the UI's own controls call HTTP rather than MCP. Parity therefore
        only holds if both are bindings over one implementation. Two
        implementations of "accept a candidate" diverge within weeks and the
        divergence is invisible until an agent and a click produce different
        results on the same catalogue.

        ENFORCEMENT IS JUDGEMENT, NOT STRUCTURE, and this is recorded rather than
        implied: the enforcement column says "Critic", meaning a reviewer reading
        handlers. No test fails when logic creeps into a binding. Same gap that
        sent the manifest-channel norm to issue #7.

        RETROACTIVITY, done artifact-shaped rather than code-shaped — the specific
        correction from the 2026-07-20 learning that a "no existing code" answer
        self-satisfies and hides the real question. Checked against every artifact
        specifying handler or tool behaviour: api-contract's five action-dispatch
        tools are specified as dispatch plus formatting, with isError derived from
        the payload rather than decided in the tool; boundary-patterns places
        validation at the service boundary. No specified behaviour violates the
        norm. Forward-binding consequence noted: the registry-generated tool
        definitions must not become a place where per-tool logic accretes.
      alternatives_considered:
        - "Ratify but record it as unenforced — folded in instead; the enforcement gap is recorded WITH the ratification rather than as a competing option."
        - "Demote to a tracking preference like cost visibility — rejected: four artifacts already call it binding and Critic-enforced, and the MCP/UI parity requirement would lose its only structural guarantee."
      date: 2026-07-20
    - decision: "The curation plane's Python 3.14 is a uv-managed standalone build (`uv python install 3.14`); 3tears is NOT relaxed to 3.13."
      rationale: >
        Decided 2026-07-20 by the operator. This closes the open question opened the
        same day by the co-location decision.

        The recorded question rested on a premise that turned out to be false. It
        framed a choice between a 30-45 minute pyenv compile per patch release,
        relaxing 3tears to 3.13 (16 mechanical sites), or containerising from a
        python:3.14 base — and the compile cost is what made the second option
        attractive. But a prebuilt CPython for this exact target already exists:
        cpython-3.14.4-linux-aarch64-gnu, distributed by Astral via
        python-build-standalone. Verified 2026-07-20 with
        `uv python list --all-platforms --all-arches --show-urls`. Installing it is a
        download and extract, no compiler and no build dependencies. Trixie's glibc
        is far above the build's baseline and the Pi is aarch64, which is the same
        fact the earlier wheel audit established.

        With the compile gone, relaxing 3tears buys nothing and costs a real
        untested risk: the 2026-07-19 audit was STATIC, so behaviour under 3.13 —
        asyncio internals, and pydantic/langchain annotation resolution under eager
        vs lazy __annotations__ — was never exercised. Keeping 3tears unmodified
        means that risk is never taken, and it preserves the Python version pin as
        a live rationale for the two-plane split rather than leaving the split on
        its other two legs.

        Two consequences recorded rather than waved past. (1) Curation's interpreter
        now comes from Astral's channel, not Debian's, so CPython security fixes
        arrive via `uv python upgrade`, NOT `apt upgrade` — a CVE becomes a
        two-plane action where an operator would reasonably assume one. Recorded in
        security-model.md § Supply Chain and operational-spec.md § Routine
        Operations. (2) A standalone interpreter cannot see distro site-packages.
        That is survivable only because label rendering already moved to the display
        plane: curation's stack is all wheels, and pycairo — the one source-only
        aarch64 dependency — is on the display side. Adding anything to curation
        that needs distro C bindings is what breaks this decision.

        Knock-on for a still-open preference: uv is now a required install on the Pi
        regardless, which makes it the incumbent dependency manager rather than a
        new dependency. Noted in project-preferences.md; deliberately NOT decided
        here, since the display plane builds Cython against system headers.
      alternatives_considered:
        - "Relax 3tears to 3.13 and use the system interpreter — simplest end state, one interpreter, but needs an upstream PR merged and carries untested behavioural risk under 3.13."
        - "pyenv source build — same end state as the chosen option, but with a 30-45 minute compile per patch release. Strictly dominated once the prebuilt binary was found."
        - "Container from a python:3.14 base — no compiling, but adds Docker against the operator's stated infrastructure constraint and complicates the shared ART_ROOT design the inter-plane contract rests on."
      date: 2026-07-20
    - decision: "The hard monthly spend ceiling is an OpenRouter per-key credit limit, not application-side metering."
      rationale: >
        Decided 2026-07-20 by the operator, against a recommendation for a
        belt-and-braces design (app-side soft cap plus provider hard cap). The
        operator's answer is the better one and the recommendation was withdrawn.

        OpenRouter supports an optional per-key credit limit with daily/weekly/
        monthly reset, returning 402 when exhausted, and search-plugin fees bill as
        OpenRouter credits — so ONE number covers tokens and search together and
        cannot be bypassed. An application meter that fails open is
        indistinguishable from one that works: no error, no alert, just a bill.
        That is the same defect shape this codebase already ships in `upload_file`
        (catches every exception, reports success anyway).

        The concern that this would degrade `halted_by_budget` from a designed
        outcome to an exception was checked and does NOT hold. A 402 is
        unambiguous, so the outcome is cleanly derivable; `GET /api/v1/key`
        returns `limit_remaining` as an authoritative "budget left" that cannot
        drift from a local tally; and per-generation `cost` covers "what did this
        run cost". The UX need survives without owning a meter that can lie.

        Two residuals recorded rather than waved past: the reset is midnight UTC
        (so "month" is the UTC calendar month, not local), and a 402 arrives
        mid-run, so a run can halt partially — which the error model already
        declares normal, but which makes `halted_by_budget` a state the catalogue
        must represent, not just an error string.
      alternatives_considered:
        - "App-side soft cap at ~$18 plus provider hard cap at $20 — graceful halt before the ugly 402, at the cost of a second enforcement path that can itself fail open. Recommended, then withdrawn."
        - "App-side metering only — full control of halt semantics, but the fail-closed guarantee is only as strong as our own code, which is the exact class of thing the 2024 codebase got wrong."
      date: 2026-07-20
    - decision: "Discovery carries a per-run search cap, separate from the monthly ceiling."
      rationale: >
        Decided 2026-07-20. A monthly ceiling does not bound a single runaway run,
        and a pre-run cost estimate is not an estimate if the run can freely exceed
        it. The cap is derived from the work count, is a deployment value (never
        hardcoded), and hitting it is a distinguishable outcome rather than a
        silent truncation of results.
      alternatives_considered:
        - "Monthly cap only — fewer knobs, but one bad intent can consume a meaningful slice of the month and the pre-run estimate becomes a guess rather than a bound."
        - "Per-run DOLLAR cap covering tokens and searches together — more directly meaningful, but it cannot be checked before the run starts, only tripped during it."
      date: 2026-07-20
    - decision: "Back up the catalogue AND build an exercised restore path; treat the image tree as disposable."
      rationale: >
        Restore added 2026-07-20 at the operator's insistence, and they are right:
        a backup path that has never been restored from is a hope, not a backup.
        The restore path is a first-class deliverable with an exercise step —
        restoring onto a scratch directory and confirming the system comes up —
        not a documented procedure nobody has run.

        The design makes this unusually cheap to test. Because the image tree is
        deliberately disposable, RESTORE IS PARTIAL BY DESIGN: drop the catalogue
        back with an empty image tree, and the readiness design in
        artifacts/architecture.md produces a theme manifest that excludes
        everything unrendered, reports why, and re-acquisition refills it. The
        system self-heals visibly rather than failing opaquely or pretending to
        be fine. Verifying a restore therefore does not require staging gigabytes.

        Urgency raised the same day: the operator confirmed the Pi boots from SD
        card, so the one irreplaceable asset lives on the most failure-prone
        component in the system. SQLite plus unexpected power loss on consumer
        flash is the classic Pi corruption story.

        WHY THE CATALOGUE AND NOT THE IMAGES — this inverts the intuitive backup
        priority and is worth stating because of that. Every source image is
        re-fetchable from its source URL; the product already relies on this, and
        it is the stated reason `all.json` can be replaced rather than migrated.
        What is NOT re-fetchable is the curatorial layer: accept/reject verdicts,
        which image instance was chosen canonical and why, hand-approved mat
        colours, theme membership, and suppression scopes. Losing it means
        re-running discovery, which costs real money and re-asks the curator every
        judgement they already made. The catalogue is megabytes; the image tree is
        gigabytes and reconstructible.
      alternatives_considered:
        - "Back up everything — simple, but ~10x the volume to protect the 1% that matters, and it obscures which artefact is actually irreplaceable."
        - "Backup only, restore documented but never exercised — the default outcome, and the reason untested backups are a recurring class of incident."
      date: 2026-07-20
    - decision: "Pin the IT8951 driver to 9f13613 or vendor it."
      rationale: "omni-epd declares it as an unpinned git dependency resolving to whatever master currently is. Builds are only reproducible today because the repo has not moved since 2023. Roughly 1,500 lines of frozen code the project depends on completely."
      alternatives_considered: ["Leave unpinned — a silent reproducibility failure waiting on an upstream commit."]
      date: 2026-07-19

# =============================================================================
# DESIGN DECISIONS
# =============================================================================
# UX, IA, and design decisions. Some fields (like error_handling_approach) apply
# to all products; others (like visual_direction) only apply to products with a UI.
# Each: { decision, rationale, date }

design_decisions:
  information_architecture: []
  interaction_patterns: []
  accessibility_approach: >
    Two surfaces with completely different accessibility profiles, and the
    important one is physical.

    Curation UI (LAN-only web app, single advanced operator): WCAG 2.1 AA as the
    baseline — keyboard navigation, visible focus, meaningful labels, sufficient
    contrast. One domain-specific caution: this is an image-review tool whose
    whole job is judging colour, so the UI chrome must never sit at a contrast
    ratio that competes with the artwork, and colour must never be the sole
    carrier of state in a candidate grid (accept/reject needs a non-colour
    indicator).

    The e-paper label is the accessibility surface that actually matters. It is
    read by household members and guests at standing distance, on a 16-level
    greyscale panel with no backlight, in whatever ambient light the room has. It
    has no interface to navigate — legibility IS the accessibility story:
    type size at reading distance, contrast on a non-emissive panel, and line
    length. The 2024 implementation hardcodes "Sans 18" for a panel geometry that
    is no longer the target, so this needs re-deriving for the 1448x1072 panel
    rather than carrying forward.

    The TV surface has no accessibility affordances by deliberate design — it is
    artwork on a wall, and adding overlays would violate the product's core
    identity constraint.
  error_handling_approach: >
    Scaled to medium risk, and shaped by one dominant fact: on the display plane
    a swallowed error is invisible, because the only feedback channel is a picture
    on a wall that keeps looking fine.

    Taxonomy the design must distinguish:
      * Recoverable and expected — partial dezoomify tile fetches, museum rate
        limiting, malformed LLM JSON, transient TV websocket drops. Retry with
        backoff; these are normal operating conditions, not incidents.
      * Recoverable but degrading — vision model unavailable so mat colour falls
        back to the dominant-colour algorithm. Must be RECORDED (MatColor.method),
        not silent: the 2024 code degrades invisibly.
      * Fatal for one item — an artwork that cannot be acquired or rendered. Fails
        that item, marks it, and continues the batch. Never aborts the run.
      * Fatal for the run — budget ceiling reached, TV unreachable, ART_ROOT
        missing. Terminates with a distinguishable state; `halted_by_budget` is a
        first-class outcome, not an error.

    Two rules that exist because the 2024 code broke them:
      * Never report success on a failed operation. `upload_file` catches every
        exception, logs it, and still returns — recording a null content id while
        the retry loop sets success = True.
      * Catch specific exception types. A genuinely necessary broad catch carries
        `# prawduct:allow prawduct/broad-except -- reason`.

    Curator-facing errors surface in the web UI with enough context to act on;
    display-plane errors must reach somewhere a human actually looks, which the
    systemd journal alone does not satisfy.
  # API decisions — populate when classification.structural.exposes_programmatic_interface is set.
  # These record the DECISION (including a deliberate "none — internal-only"), not a mandate to
  # version. A deferral must be dated and carry a revisit trigger. See the api-contract artifact.
  # api_versioning_approach: { scheme, deprecation_policy, stability_tiers,
  #                            status: active|deferred, rationale, revisit_trigger (if deferred), date }
  api_versioning_approach:
    scheme: "none — no version negotiation. Tool names frozen; actions are the unit of evolution; changes additive-only."
    deprecation_policy: "Announce, retire, annotate inline at the replacing site. No compatibility shims. Removals/renames of tools are not permitted; of actions, they are breaking and announced."
    stability_tiers: "Tool names FROZEN. Action values, required params, descriptions STABLE. Optional params and result fields ADDITIVE."
    status: active
    rationale: >
      SUPERSEDED 2026-07-19, same day, by its own revisit trigger firing. The
      original decision — no versioning, internal-only — was sound while every
      surface had exactly one first-party consumer deployed from this repo. The
      MCP requirement invalidated that premise: Claude Code is an external
      consumer, and an MCP tool surface is precisely the case where adding
      versioning later breaks every bound client.

      This is recorded as REOPENED rather than silently amended, because the
      trigger doing its job is the evidence the mechanism works.

      Two surfaces now need separate answers, and they are not the same problem:
        * MCP tool surface — external. Tool names, argument schemas, and result
          shapes are the contract. Needs a stance on adding/removing tools,
          renaming arguments, and changing result shapes.
        * curation↔display contract — still internal, single consumer, deployed
          together. The original "none" reasoning still holds here.
      DECIDED 2026-07-19, after the reopening above. The specification offers
      nothing to conform to: SEP-1575 (tool semantic versioning, proposed
      2025-09-29) is a dormant proposal adopted into no spec revision. What the
      protocol does give is notifications/tools/list_changed, which Claude Code
      honours by refreshing automatically — and every client here is the operator's
      own, so a breaking change means telling one person, not a migration window.

      Two non-obvious rules fall out. Tool NAMES are frozen and pinned by test:
      both of the operator's production servers learned this the hard way, and
      cordyceps' one consolidation required follow-up sweeps through prompts,
      guides, and a stale tool count in its own docs. And a DESCRIPTION change is
      treated as breaking, because it alters tool-selection probability even when
      the schema is untouched — sound reasoning rather than a measured finding, and
      flagged as such in the artifact, but it puts descriptions under the same
      review discipline as schemas.
    revisit_trigger: "A consumer appears that is not deployed or configured by the operator — e.g. publishing the server for third parties, or listing it in a connector directory (whose review criteria would additionally forbid multiplexing reads and writes in one tool)."
    date: 2026-07-19
  # api_error_model_approach: { envelope (e.g. RFC-7807/problem+json), codes, status, rationale, date }
  api_error_model_approach:
    envelope: "Tool results with isError: true, derived from a boolean `success` field in the payload — never JSON-RPC protocol errors, except unknown-tool. Every error carries: what was wrong, the enumerated valid set, a correct example, and a pointer to action='help'."
    codes: "No numeric code space. Errors are self-describing strings plus structured valid_actions / required / optional / example / hint fields. A machine-readable discriminator is added only where a caller must branch — halted_by_budget being the standing example."
    status: active
    rationale: >
      No longer safely deferrable. Agents bind to error shapes to decide whether
      to retry, escalate, or stop, so an unstable or unstructured error model is
      a correctness problem for every MCP client, not a nicety.

      Already decided regardless of envelope choice:
        * Errors must be explicit and typed. The display plane's failure mode is
          a silently frozen picture, and the product's existing defect pattern is
          operations reporting success on failure.
        * `halted_by_budget` is a distinguishable outcome, not a generic error —
          an agent must be able to tell "you are out of money" from "the fetch
          failed" and stop rather than retry.
        * Partial success is normal (partial dezoomify tiles, some candidates
          acquired), so the model must express it rather than collapsing to
          ok/fail.
      DECIDED 2026-07-19. The MCP specification supports returning execution errors
      as tool results directly: they are meant to carry "actionable feedback that
      language models can use to self-correct and retry", and clients SHOULD feed
      them back to the model. Protocol errors are reserved for the one case the
      model cannot act on — a tool that does not exist.

      Two details taken from the operator's production servers rather than invented.
      isError is DERIVED from the payload rather than set by hand, because a
      hand-set flag drifts from the body it describes. And there is deliberately NO
      fuzzy nearest-match ("did you mean") — neither server implements it; the
      substitute is always to enumerate the full valid set inline, which is more
      useful to a model than a single guess and cannot mislead.
    revisit_trigger: "RESOLVED — the MCP tool surface was designed 2026-07-19 and the envelope decided with it."
    date: 2026-07-19
  observability_approach: >
    The defining constraint is that failure is silent by construction — the only
    feedback channel is a picture on a wall, and a stalled loader is
    indistinguishable from a working one showing a static image. Scaled to medium
    risk: structured logging with correlation context on both planes, and the
    display plane must surface its health somewhere a human actually looks rather
    than only to the systemd journal. Two specific defects to fix, not inherit:
    upload_file catches every exception, logs, and still reports success; and
    print() is used for operational output throughout, which produces journal
    lines with no level and no timestamp. LLM spend is an observability signal
    here, not just a cost control — the hard cap cannot fail closed without
    metering. 3tears-observe is available and carries structured logging plus
    OpenTelemetry, at no infrastructure cost.
  infrastructure_dependencies: >
    Deliberately near-zero. Curation plane: SQLite on local disk; no database
    server, no message broker, no container orchestration (see technical_decisions
    and the operator's explicit "no NATS or anything crazy" constraint). Display
    plane: the local filesystem and two devices — the Frame TV over LAN websocket
    and the e-paper HAT over SPI.
    Mock boundaries for testing: the six foreign APIs listed under
    classification.foreign_apis are all mocked at their module boundary. The TV and
    the e-paper panel are the two that CANNOT be meaningfully faked end-to-end —
    they need either real hardware or an accepted gap, which is what makes the
    "verify the TV still works" item gating rather than routine.
  visual_direction: >
    Deferred to design; see product_identity.visual_preferences for the one hard
    constraint (no chrome on the TV output). The curation UI has no precedent in
    this repo — the 2024 product had no visual surface at all.

# =============================================================================
# OPEN QUESTIONS
# =============================================================================
# Unresolved decisions. Normal during discovery, shrinks toward zero
# before artifact generation.
# Each:
#   question: string
#   blocking: string (what can't proceed)
#   waiting_on: "user" | "research"
#   priority: high | medium | low

open_questions:
  - question: "Which specific cheap vision model handles mat-colour selection?"
    blocking: "Nothing structural — the two-tier model split is decided; only the specific model is open."
    waiting_on: research
    priority: low
    # RESOLVED IN PRINCIPLE 2026-07-19: operator confirmed a separate cheap vision
    # model is fine. Pick the model at planning time and re-verify pricing then.
    # Background: both models chosen for discovery are text-only — GLM-5.2 is listed
    # "text input and output", and DeepSeek V4 Pro's OpenRouter page declares no
    # image modality — while ai_mat_color() sends a base64 PNG. Discovery and
    # mat-colour therefore need different models, which is exactly what the
    # OpenRouter multi-provider decision already enables. Vision volume is one call
    # per accepted artwork, so the model choice barely moves the monthly total.
  # RESOLVED 2026-07-20: "Does agentic discovery need paid web search, and is that
  # inside or outside the $20 ceiling?" INSIDE, comfortably. Verified against
  # OpenRouter documentation: Parallel $0.001/request, Exa $0.005, Perplexity
  # $0.005, all including 10 results. A ~20-work run makes 30-50 searches, so
  # search costs $0.03-0.25 against ~$0.13-0.24 of tokens. A run lands at
  # $0.16-0.49 and $20 buys 40-125 runs a month.
  #
  # The original premise was WRONG and is retired: search cannot "dominate token
  # spend by an order of magnitude" at this volume — worst case it roughly doubles
  # per-run cost. See artifacts/nonfunctional-requirements.md § Cost Constraints.
  #
  # The meter question dissolved rather than being answered: search fees bill as
  # OpenRouter credits, so token spend and search spend are ONE number under one
  # ceiling. Routing search through OpenRouter's plugin rather than a direct Exa
  # account is strictly better on both axes ($0.005 vs $0.007, and one meter
  # instead of two).
  - question: "Which search engine should discovery default to — Parallel, Exa, or Perplexity?"
    blocking: "Nothing structural. All three are affordable; this is a result-quality decision with no evidence yet."
    waiting_on: research
    priority: medium
    # Opened 2026-07-20 when the cost question resolved without discriminating
    # between engines: the spread is $0.05 vs $0.25 per run, which against a $20
    # ceiling is not decision-relevant. Choosing on price would be choosing on the
    # one axis that does not matter. Deferred to a build-time spike, which must
    # compare on this product's actual hard cases — resolving a named work to a
    # specific museum page, and answering a recency-bound intent ("recent
    # award-winning art") — not on generic search relevance.
  - question: "Does relaxing 3tears to 3.13 survive a real test run under 3.13?"
    blocking: "Merging the upstream relaxation PR. NOTHING in this product — see below."
    waiting_on: research
    priority: low
    # NOW FULLY OFF THIS PRODUCT'S PATH as of the 2026-07-20 interpreter decision:
    # curation runs a uv-managed 3.14 and 3tears is not relaxed, so this product
    # never exercises 3tears under 3.13. Retained as an upstream 3tears concern
    # only. Avoiding this untested risk was part of why the decision went the way
    # it did.
    # The only gap left by the 2026-07-19 audit, which was static (syntax and
    # stdlib-symbol level, high confidence, three converging methods). Residual
    # risk is behavioural: asyncio internals, and pydantic/langchain annotation
    # resolution under eager (3.13) vs lazy (3.14) __annotations__. A static PEP
    # 649 reliance check found zero hits. Only a real 3.13 test run closes it.
  # RESOLVED 2026-07-19: "What is the MCP tool surface — the operations, their
  # granularity, and their error model?" Answered in full; see
  # artifacts/api-contract.md and technical_decisions.technology below. Five
  # action-dispatch tools, registry-generated definitions, errors as tool results
  # with isError derived from the payload. The framing in the original question
  # turned out to be partly wrong: the intention-versus-CRUD trade dissolved once
  # it was noticed that the worked example ("add all of Dali") can never be one
  # call — phase 2 takes minutes and review needs a human.
  # RESOLVED 2026-07-20 by the operator: set_verdict REQUIRES EXPLICIT WORK IDS and
  # refuses a bare "accept everything pending". Recorded in
  # technical_decisions.technology; the artifact text is in api-contract.md
  # § Security. (This entry sat stale after the decision was written into prose —
  # caught by Critic review, and the same sweep failure the learnings entry names.)
  # RESOLVED 2026-07-20: "What cost threshold triggers work-list approval before
  # phase 2?" The gate triggers on WORK COUNT, not cost — the framing in the
  # original decision was wrong and is amended.
  #
  # Once the cost research landed, a dollar threshold was gating on the axis that
  # does not matter: a run costs $0.16-0.49, so any cost threshold either never
  # fires or fires at a number too small to mean anything to a curator. What the
  # gate is actually for is catching "you asked for Dali and I found 200 works" —
  # a SCOPE judgement. Count is what a curator can judge at a glance; "$1.00"
  # does not tell them the run found 200 works.
  #
  # The number itself remains a deployment value and must NOT be hardcoded.
  # Setting it is a tuning exercise for first real use, not a blocking decision.
  # RESOLVED 2026-07-20 by the operator: "How does Python 3.14 get onto the Pi for
  # the curation plane — or should 3tears be relaxed to 3.13 instead?" A uv-managed
  # standalone build; 3tears stays unmodified. Recorded in
  # technical_decisions.operational; artifact text in operational-spec.md
  # § The Curation Interpreter.
  #
  # This is the fifth question whose PREMISE was the thing that needed checking.
  # It was framed as a cost tradeoff anchored on "3.14 on a Pi is a 30-45 minute
  # source build per patch release" — true only of pyenv. A prebuilt
  # cpython-3.14-linux-aarch64-gnu exists (python-build-standalone, via Astral),
  # verified with `uv python list --all-platforms --all-arches`. The expensive
  # option was never expensive, so the tradeoff the question posed did not exist.
  # RESOLVED 2026-07-20 by the operator: "How is the re-search after reject_image
  # modelled — its run row, its states, and its rejection record?" All three
  # defects, as one design. Recorded in technical_decisions.data_model; artifact
  # text in data-model.md (DiscoveryRun, CandidateWork, constraints 14-15) and
  # api-contract.md.
  #
  #   1. resolve_images creates a DiscoveryRun with kind='resolve' and
  #      parent_run_id. Reuses status/cancel/spend/halted_by_budget rather than
  #      inventing a second handle. Constraint 14 refuses ids already covered by an
  #      in-flight resolve run.
  #   2. NO new states. "Running" derives from the run row; "found nothing" is
  #      resolution_status='unresolved', widened to mean the LATEST attempt — a
  #      redefinition written down explicitly rather than left implicit. Follows
  #      the ratified derived-not-stored readiness decision: a stored `resolving`
  #      would be a second truth beside the run row and could drift.
  #   3. set_verdict no longer accepts awaiting_better_image; reject_image is the
  #      only entry, so rejected_at can never be skipped. Structurally impossible
  #      rather than defended against.
  #
  # Fixing (1) largely dissolved (2) — the run row IS the missing state. Same
  # pattern as the questions that dissolved on 2026-07-19/20: the premise (that
  # three situations needed three names) was the thing to check.
  # RESOLVED 2026-07-20 by the operator: "Should the MCP surface expose resources
  # in addition to tools?" NO RESOURCES IN v1. Tools cover every read, adding
  # resources later is purely additive and breaks no client, so deferring costs
  # nothing while building a second concept for the same data now costs real work.
  # The one genuine candidate — "what's on the wall right now", which resources can
  # make subscribable and tools cannot — was declined for v1: nothing needs it, and
  # it would require display-plane state to reach the MCP server on the curation
  # plane, across the one-directional manifest boundary. Reopen if a client wants
  # to BROWSE rather than call. Original analysis retained below.
  #   waiting_on: user / priority: low
    # Claimed as carried in api-contract.md on 2026-07-19 but never actually filed;
    # caught by Critic review. The MCP spec's tools/resources split is about CONTROL
    # (who decides when something enters context), not mutability, and it never says
    # read-only operations must be resources. Anthropic's guidance says a tool is
    # right when the result depends on parameters the model chooses — which covers
    # every read here. A stable browsable artifact (active theme, display state)
    # could still earn a resource later.
  # RESOLVED 2026-07-20, all five below, in artifacts/architecture.md.
  #
  # "What is the single source of truth for 'this artwork is ready to display'?"
  #   The question contained the error. There is no single readiness, there are
  #   TWO, and conflating them was the bug. CATALOGUE readiness (can this be
  #   rendered?) is curation's, evaluated at manifest-build time in exactly one
  #   place. DEVICE readiness (is it on the TV?) is display's, lives in
  #   display-state.sqlite, and never enters the catalogue. Neither is a stored
  #   flag, so neither can drift. Manifest membership IS catalogue readiness, and
  #   because the manifest is the only thing display ever sees, the recorded
  #   failure (display selecting an unrenderable work) becomes structurally
  #   impossible rather than defended against. Theme membership stays a CURATORIAL
  #   statement; a work may be in a theme and absent from the manifest.
  #   Obligation accepted: the manifest build must report its exclusions per work
  #   with reasons, or the design trades a loud failure for a silent one.
  #
  # "Where does the display plane's rotation list live when the curation plane is
  # down?" In a theme manifest file in the shared ART_ROOT, written atomically by
  #   curation (temp + os.replace) and read by display. Display makes NO network
  #   call to curation at all. Staleness is unbounded by design: if curation is
  #   stopped, display keeps showing the last manifest forever, which is normal
  #   operation rather than a degraded mode.
  #
  # "Which web framework serves the curation plane?" FastAPI — see
  #   technical_decisions.technology. Note that NEITHER of the operator's
  #   production MCP servers turned out to be a precedent: hallucinote is
  #   stdio-only, cordyceps is C# on a hand-rolled HttpListener. The question's
  #   premise that progress notifications must be supported also dissolved; see
  #   the amendment to the start-and-poll decision.
  #
  # "Where does the curation plane actually run, and is it always-on?" On the Pi,
  #   alongside the display plane, always-on but usually idle. Operator's decision
  #   2026-07-20. Storage was checked first and does not force otherwise (500
  #   works is ~10 GB). Discovery can therefore be a background job.
  #
  # "Do opencv, scikit-image, and pycairo have working aarch64/current wheels on
  # Python 3.14?" YES, verified against the PyPI JSON API 2026-07-20:
  #   scikit-image 0.26.0 cp314 + manylinux aarch64; numpy 2.5.1 and scipy 1.18.0
  #   cp314 aarch64; opencv-python-headless 5.0.0.93 ships cp37-abi3 aarch64
  #   manylinux wheels (stable ABI, so forward-compatible to 3.14);
  #   pydantic-core 2.47.0 cp314 aarch64. The one exception is pycairo 1.29.0,
  #   which is source-only on Linux aarch64 and needs libcairo2-dev — and that no
  #   longer touches the curation plane, because label rendering moved to the
  #   display plane, which already has the GTK stack.
  # RESOLVED 2026-07-20 by the operator: "What is the minimum acceptable source
  # resolution, and what happens to works below it?" Recorded in
  # technical_decisions.data_model; artifact text in nonfunctional-requirements.md
  # § The mat is geometric, and the floor is physical.
  #
  # THE QUESTION WAS UNANSWERABLE AS FILED, and finding out why was the work. It
  # asked for a minimum resolution. Adequacy is defined against the artwork box;
  # the box is defined by panel geometry and mat width; the operator ruled that
  # panel geometry is a DEPLOYMENT VALUE because other people run other panel
  # sizes. So there is no single number — there is a formula, in the same physical
  # units as the mat: a minimum rendered size on the wall, which scales with the
  # panel automatically.
  #
  # A prerequisite had to be decided first and was not filed as a question at all:
  # the mat geometry itself was specified NOWHERE, and the 2024 code's
  # image.thumbnail() makes the mat aspect-ratio residue — so a 16:9 source gets no
  # mat, contradicting data-model.md's "the mat is the deliberate frame".
  #
  # Below the floor: not rejected, not hidden. Phase 2 does not auto-select;
  # the grid shows it labelled with rendered inches; the curator may take it. All
  # instances below floor => resolution_status='unresolved', already first-class.
  # RESOLVED 2026-07-20 by the operator: "Should discovery results carry
  # licence/rights enforcement, or is rights metadata display-only?" DISPLAY-ONLY;
  # it gates nothing. Recorded in technical_decisions.data_model; artifact text in
  # data-model.md constraint 13 and api-contract.md.
  # The reframing that made it useful anyway: rights status is a PROVENANCE and
  # source-quality signal, not merely a legal one — a holding institution's own
  # public-domain scan is usually the authoritative file. Reopen trigger recorded:
  # sharing/export, or the catalogue becoming public.

