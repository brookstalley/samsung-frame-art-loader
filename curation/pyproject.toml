[project]
name = "curation"
version = "0.1.0"
description = "Curation plane — discovery, acquisition, catalogue, and the MCP + HTTP surfaces."
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    # Imported directly by the ASGI app for its request types. It arrives
    # transitively via fastapi, but the declared set has to describe what the
    # code imports — fastapi is free to change how it vendors starlette.
    "starlette",
    "uvicorn[standard]",
    "mcp>=1.27",
    "pydantic",
    "httpx",
    "python-dotenv",
]

# 3tears core is deliberately absent and is not expected. The catalogue's durable
# tier is first-party code matching that framework's DurableStore contract
# structurally, so no framework code is imported and there is nothing to resolve;
# its L1 tier is an in-memory cache that would not have persisted the catalogue
# anyway. Recorded in full at project-state.yaml -> technical_decisions.technology.
#
# Deliberately not pinned yet:
#   3tears-models — the operator's own multi-provider model adapters, which need
#     none of the above; it arrives with the discovery work that calls it.
#   pillow, opencv-python-headless, scikit-image, numpy — acquisition and the mat
#     engine, which arrive with that work rather than being carried unused.

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "black>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py314"]
line-length = 130

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
# The strict set. Unlike the root project there is no legacy carve-out here:
# this plane is new code and every one of these rules applies to all of it.
select = ["E", "F", "I", "UP", "B", "T20", "TRY", "ANN"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
