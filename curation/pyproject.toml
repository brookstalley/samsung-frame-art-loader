[project]
name = "curation"
version = "0.1.0"
description = "Curation plane — discovery, acquisition, catalogue, and the MCP + HTTP surfaces."
# Every dependency declared below resolves well under 3.14; the floor is here for
# `3tears-models`, listed under "deliberately not pinned yet", which declares the
# same one and arrives with the discovery work. Verified 2026-07-27: the whole
# declared set resolves and imports on CPython 3.14.4.
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    # Imported directly by the ASGI app for its request types. It arrives
    # transitively via fastapi, but the declared set has to describe what the
    # code imports — fastapi is free to change how it vendors starlette.
    "starlette",
    # Plain, not `[standard]`. That extra pulls httptools, uvloop, watchfiles,
    # websockets and pyyaml — none imported by any module here, and the same
    # ground on which pydantic and httpx were kept out below. It also carried a
    # reload watcher this plane never starts and a websocket implementation the
    # MCP transport does not use, while silently deciding the HTTP parser for an
    # always-on-but-idle plane on a Pi. Dropped 2026-08-01; add it back with the
    # named component and the measurement that wanted it.
    "uvicorn",
    "mcp>=1.27",
    "python-dotenv",
    # The typed response models the HTTP API returns. It resolves transitively
    # via mcp, but this code imports it directly now, and the rule below cuts
    # both ways: what the code imports belongs in this list.
    "pydantic",
    # Thumbnails. Arrived ahead of the acquisition work below because a grid of
    # 4K renditions is not a page and nothing in the standard library decodes a
    # JPEG — `seed/images.py` reads the SOF header for dimensions precisely
    # because that needed no decoder, and downscaling does.
    "pillow",
]

# 3tears core is deliberately absent and is not expected. The catalogue's durable
# tier is first-party code matching that framework's DurableStore contract
# structurally, so no framework code is imported and there is nothing to resolve;
# its L1 tier is an in-memory cache that would not have persisted the catalogue
# anyway. Recorded in full at project-state.yaml -> technical_decisions.technology.
#
# Deliberately not pinned yet:
#   3tears-models — the operator's own multi-provider model adapters, which need
#     none of the above; it arrives with the discovery work that calls it.
#   opencv-python-headless, scikit-image, numpy — acquisition and the mat engine,
#     which arrive with that work rather than being carried unused. Pillow was in
#     this group until the browser surface needed to downscale a 4K rendition.
#   httpx — the inverse of the starlette case above. The mcp *client* uses it, so
#     the contract tests exercise it through that library; no first-party module
#     imports it, so declaring it would claim a dependency the code does not have.

[dependency-groups]
# httpx is declared here and not above on purpose: the browser-surface tests
# import it directly to drive a booted server, and no first-party module does.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "black>=24", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py314"]
line-length = 130

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
# The strict set. Unlike the root project there is no legacy carve-out here:
# this plane is new code and every one of these rules applies to all of it.
select = ["E", "F", "I", "UP", "B", "T20", "TRY", "ANN"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
